name: 缺陷报告
description: 使用脱敏合成数据报告可复现的普通缺陷；安全问题不得使用此表单。
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        不要提交密码、令牌、私钥、DSN、玩家/账户数据、生产日志、发布审批、原始抓包或漏洞细节。
        安全问题请改用仓库 Security 页的私密漏洞报告入口。
  - type: input
    id: revision
    attributes:
      label: 受影响提交或版本
      description: 提供完整 Git commit SHA 或受保护版本 Tag；不要只写“最新版”。
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Web 表现层
        - RGS / 钱包 / 数据库
        - 部署 / AWS / Kubernetes
        - CI / 供应链 / 发布
        - 文档 / 其他
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 仅使用脱敏合成数据，列出环境、命令和确定性步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 已执行验证
      description: 列出测试命令、退出码与不包含秘密的最小结果。
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 数据与安全确认
      options:
        - label: 我确认本报告不包含秘密、真实玩家/账户数据、生产日志、原始抓包、发布审批或未公开漏洞细节。
          required: true
        - label: 我没有对未经书面授权的生产或第三方端点执行压力、穿透或 DDoS 测试。
          required: true
