name: AWS application deployment

on:
  pull_request:
  workflow_dispatch:
    inputs:
      static_only:
        description: 仅执行无云凭据的静态合同，不绑定制品也不部署
        required: true
        default: true
        type: boolean
      target_environment:
        description: 受保护的应用部署目标环境
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod-primary
          - prod-dr
      release_tag:
        description: 生成三个签名摘要的受保护发布标签
        required: true
        type: string
      rgs_digest:
        description: RGS ECR sha256 摘要，不接受 tag
        required: true
        type: string
      migrator_digest:
        description: Migrator ECR sha256 摘要，不接受 tag
        required: true
        type: string
      web_digest:
        description: Web ECR sha256 摘要，不接受 tag
        required: true
        type: string
      configuration_sha256:
        description: Web 构建时绑定的配置 SHA-256
        required: true
        type: string
      deployment_mode:
        description: 普通发布，或在零旧 Pod 状态完成 HMAC maintenance
        required: true
        type: choice
        options:
          - standard
          - maintenance-complete
      hmac_quiesce_evidence_version_id:
        description: 仅 maintenance-complete 使用的固定证据 VersionId
        required: false
        type: string
      hmac_quiesce_evidence_sha256:
        description: 仅 maintenance-complete 使用的规范化证据 SHA-256
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs.static_only && format('slots-aws-environment-mutation-{0}', inputs.target_environment) || format('slots-aws-static-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  static-contract:
    name: AWS application static contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_artifact_id: ${{ steps.source.outputs.artifact-id }}
      source_artifact_digest: ${{ steps.source.outputs.artifact-digest }}
    steps:
      - name: 检出无持久凭据的源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 执行无云凭据静态和负向门禁
        working-directory: slots-game
        run: |
          set -euo pipefail
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          deploy/aws-production/workflow/verify-contract.sh
          deploy/aws-production/workflow/test-negative-contract.sh
          deploy/aws-production/workflow/test-live-application-secrets.sh
          deploy/aws-production/workflow/test-rendered-release-network.sh
          deploy/aws-production/workflow/test-web-rgs-origin.sh
          deploy/aws-production/workflow/test-live-definition-identity.sh
          deploy/aws-production/workflow/test-hmac-quiesce-evidence.sh
          deploy/aws-production/workflow/test-hmac-only-release-diff.sh
          deploy/aws-production/workflow/test-hmac-application-maintenance.sh
          deploy/aws-production/workflow/test-latest-terraform-delivery.sh
          shellcheck deploy/aws-production/workflow/*.sh deploy/aws-production/workflow/fixtures/*.sh \
            deploy/aws-production/verify-live-platform-prerequisites.sh \
            deploy/aws-production/verify-live-alb-edge.sh
          ruby -c deploy/aws-production/render-external-secrets.rb
          ruby -c deploy/aws-production/verify-waf-rollout-evidence.rb
          ruby -c deploy/aws-production/workflow/verify-rendered-release.rb
          ruby -c deploy/aws-production/workflow/verify-web-rgs-origin.rb
          ruby -c deploy/aws-production/workflow/verify-hmac-only-release-diff.rb
          ruby -c deploy/aws-production/workflow/verify-hmac-finalize-attestation.rb

      - name: 封装受保护部署所需的最小源码
        if: github.event_name == 'workflow_dispatch' && !inputs.static_only
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/aws-deployment-source"
          mkdir -p "$bundle/slots-game/deploy/aws-production/workflow" \
            "$bundle/slots-game/deploy/cluster-production" \
            "$bundle/slots-game/deploy/supply-chain" \
            "$bundle/slots-game/infra/terraform/contracts"
          cp slots-game/deploy/aws-production/workflow/validate-environment.sh \
            slots-game/deploy/aws-production/workflow/validate-release-inputs.sh \
            slots-game/deploy/aws-production/workflow/verify-ecr-release.sh \
            slots-game/deploy/aws-production/workflow/verify-rendered-release.rb \
            slots-game/deploy/aws-production/workflow/verify-web-rgs-origin.rb \
            slots-game/deploy/aws-production/workflow/verify-live-application-secrets.sh \
            slots-game/deploy/aws-production/workflow/verify-live-definition-identity.sh \
            slots-game/deploy/aws-production/workflow/verify-hmac-quiesce-evidence.rb \
            slots-game/deploy/aws-production/workflow/verify-hmac-finalize-attestation.rb \
            slots-game/deploy/aws-production/workflow/download-hmac-quiesce-evidence.sh \
            slots-game/deploy/aws-production/workflow/hmac-evidence-marker.sh \
            slots-game/deploy/aws-production/workflow/hmac-application-maintenance-gate.sh \
            slots-game/deploy/aws-production/workflow/verify-hmac-only-release-diff.rb \
            slots-game/deploy/aws-production/workflow/verify-latest-terraform-delivery.sh \
            slots-game/deploy/aws-production/workflow/publish-web-release.sh \
            "$bundle/slots-game/deploy/aws-production/workflow/"
          cp slots-game/deploy/aws-production/render-external-secrets.rb \
            slots-game/deploy/aws-production/verify-live-alb-edge.sh \
            slots-game/deploy/aws-production/verify-live-platform-prerequisites.sh \
            slots-game/deploy/aws-production/verify-waf-rollout-evidence.rb \
            "$bundle/slots-game/deploy/aws-production/"
          cp -R slots-game/deploy/cluster-production/chart "$bundle/slots-game/deploy/cluster-production/"
          cp slots-game/deploy/supply-chain/extract-aws-web-static-root.sh \
            slots-game/deploy/supply-chain/verify-web-static-root.mjs \
            "$bundle/slots-game/deploy/supply-chain/"
          cp slots-game/infra/terraform/contracts/cluster-addons-interface.v1.yaml \
            "$bundle/slots-game/infra/terraform/contracts/"
          test -z "$(find "$bundle" ! -type d ! -type f -print -quit)"
          printf 'SOURCE_SHA=%s\n' "$GITHUB_SHA" > "$bundle/source-identity.env"
          printf 'WORKFLOW_RUN_ID=%s\n' "$GITHUB_RUN_ID" >> "$bundle/source-identity.env"
          printf 'WORKFLOW_RUN_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$bundle/source-identity.env"
          checksum_file="$RUNNER_TEMP/aws-deployment-source-checksums.sha256"
          (cd "$bundle" && find . -type f ! -name source-checksums.sha256 -print0 | \
            LC_ALL=C sort -z | xargs -0 sha256sum > "$checksum_file")
          mv "$checksum_file" "$bundle/source-checksums.sha256"

      - name: 上传按完整 ID 消费的部署源码
        if: github.event_name == 'workflow_dispatch' && !inputs.static_only
        id: source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-deployment-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aws-deployment-source
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  bind-deployment-source:
    if: github.event_name == 'workflow_dispatch' && !inputs.static_only
    needs: static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 在任何云 OIDC job 消费源码前，先用 Actions API 绑定不可变 ID、服务端摘要与本次来源。
    # English: Before any cloud OIDC job consumes the source code, first use the Actions API to bind the
    # immutable ID, server-side digest and this source.
    permissions:
      actions: read
    env:
      SOURCE_ARTIFACT_ID: ${{ needs.static-contract.outputs.source_artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ needs.static-contract.outputs.source_artifact_digest }}
    steps:
      - name: 失败闭合校验部署源码 artifact 元数据
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SOURCE_ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s\n' "$SOURCE_ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          metadata="$RUNNER_TEMP/deployment-source-artifact-${SOURCE_ARTIFACT_ID}.json"
          curl --fail --location --show-error --silent --proto '=https' --tlsv1.2 \
            --retry 4 --retry-all-errors \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            --output "$metadata"
          jq -e --argjson artifact_id "$SOURCE_ARTIFACT_ID" \
            --arg digest "sha256:$SOURCE_ARTIFACT_DIGEST" \
            --arg name "aws-deployment-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg source_sha "$GITHUB_SHA" '
            .id == $artifact_id and .name == $name and .expired == false and
            .digest == $digest and .workflow_run.id == $run_id and
            .workflow_run.head_sha == $source_sha
          ' "$metadata" >/dev/null
          rm -f "$metadata"

  verify-release:
    if: github.event_name == 'workflow_dispatch' && !inputs.static_only
    needs:
      - static-contract
      - bind-deployment-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: aws-${{ inputs.target_environment }}-artifact-verify
    permissions:
      contents: read
      id-token: write
    outputs:
      evidence_artifact_id: ${{ steps.evidence.outputs.artifact-id }}
      evidence_artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ARTIFACT_VERIFY_ROLE_ARN: ${{ vars.AWS_ARTIFACT_VERIFY_ROLE_ARN }}
      AWS_ECR_RGS_RUNTIME_REPOSITORY: ${{ vars.AWS_ECR_RGS_RUNTIME_REPOSITORY }}
      AWS_ECR_RGS_MIGRATOR_REPOSITORY: ${{ vars.AWS_ECR_RGS_MIGRATOR_REPOSITORY }}
      AWS_ECR_WEB_REPOSITORY: ${{ vars.AWS_ECR_WEB_REPOSITORY }}
      INPUT_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      INPUT_RGS_DIGEST: ${{ inputs.rgs_digest }}
      INPUT_MIGRATOR_DIGEST: ${{ inputs.migrator_digest }}
      INPUT_WEB_DIGEST: ${{ inputs.web_digest }}
      INPUT_CONFIGURATION_SHA256: ${{ inputs.configuration_sha256 }}
      INPUT_DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
      INPUT_EVIDENCE_VERSION_ID: ${{ inputs.hmac_quiesce_evidence_version_id }}
      INPUT_EVIDENCE_SHA256: ${{ inputs.hmac_quiesce_evidence_sha256 }}
      COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
      DEPLOYMENT_SOURCE: /tmp/slots-aws-verify-${{ github.run_id }}-${{ github.run_attempt }}/source
      RELEASE_EVIDENCE: /tmp/slots-aws-verify-${{ github.run_id }}-${{ github.run_attempt }}/evidence
    steps:
      - name: 下载静态 job 生成的精确部署源码
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.static-contract.outputs.source_artifact_id }}
          path: ${{ env.DEPLOYMENT_SOURCE }}

      - name: 在申请 OIDC 凭据前校验源码和全部摘要
        run: |
          set -euo pipefail
          test "$GITHUB_REF_PROTECTED" = true
          case "$GITHUB_REF" in refs/tags/*) : ;; *) echo '必须从受保护 tag 部署' >&2; exit 2 ;; esac
          test "$INPUT_RELEASE_TAG" = "$GITHUB_REF_NAME"
          grep -F -x "SOURCE_SHA=$GITHUB_SHA" "$DEPLOYMENT_SOURCE/source-identity.env" >/dev/null
          grep -F -x "WORKFLOW_RUN_ID=$GITHUB_RUN_ID" "$DEPLOYMENT_SOURCE/source-identity.env" >/dev/null
          grep -F -x "WORKFLOW_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" "$DEPLOYMENT_SOURCE/source-identity.env" >/dev/null
          (cd "$DEPLOYMENT_SOURCE" && sha256sum --check --strict source-checksums.sha256)
          sh "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/validate-release-inputs.sh" \
            "$INPUT_TARGET_ENVIRONMENT" "$INPUT_RELEASE_TAG" "$INPUT_RGS_DIGEST" \
            "$INPUT_MIGRATOR_DIGEST" "$INPUT_WEB_DIGEST" "$INPUT_CONFIGURATION_SHA256"
          case "$INPUT_DEPLOYMENT_MODE" in
            standard)
              test -z "$INPUT_EVIDENCE_VERSION_ID" -a -z "$INPUT_EVIDENCE_SHA256"
              ;;
            maintenance-complete)
              test "${#INPUT_EVIDENCE_VERSION_ID}" -le 1024
              printf '%s\n' "$INPUT_EVIDENCE_VERSION_ID" | grep -Eq '^[A-Za-z0-9._~+/=-]+$'
              test "$INPUT_EVIDENCE_VERSION_ID" != null
              printf '%s\n' "$INPUT_EVIDENCE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
              ;;
            *) exit 1 ;;
          esac
          sh "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/validate-environment.sh" artifact-verify

      - name: 通过 GitHub OIDC 获取制品只读角色临时凭据
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ARTIFACT_VERIFY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: slots-artifact-verify-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: 验证实际账号和 ECR 增强连续扫描
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          scanning_json=$(aws ecr get-registry-scanning-configuration --output json)
          printf '%s\n' "$scanning_json" | jq -e \
            --arg rgs "$AWS_ECR_RGS_RUNTIME_REPOSITORY" \
            --arg migrator "$AWS_ECR_RGS_MIGRATOR_REPOSITORY" \
            --arg web "$AWS_ECR_WEB_REPOSITORY" '
            .scanningConfiguration as $configuration |
            [$rgs, $migrator, $web] as $repositories |
            $configuration.scanType == "ENHANCED" and
            (
              (($configuration.rules // []) | length) == 0 or
              all($repositories[];
                . as $repository |
                any($configuration.rules[]?;
                  .scanFrequency == "CONTINUOUS_SCAN" and
                  any(.repositoryFilters[]?;
                    .filterType == "WILDCARD" and
                    (.filter == "*" or .filter == $repository)
                  )
                )
              )
            )
          ' >/dev/null

      - name: 使用临时凭据登录固定 ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}
          mask-password: true

      - name: 验证三个 digest 的仓库、签名和证明
        run: |
          set -euo pipefail
          sh "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/verify-ecr-release.sh" \
            "$INPUT_RELEASE_TAG" "$INPUT_RGS_DIGEST" "$INPUT_MIGRATOR_DIGEST" \
            "$INPUT_WEB_DIGEST" "$RELEASE_EVIDENCE"
          {
            printf 'SOURCE_SHA=%s\n' "$GITHUB_SHA"
            printf 'WORKFLOW_RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'WORKFLOW_RUN_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'TARGET_ENVIRONMENT=%s\n' "$INPUT_TARGET_ENVIRONMENT"
            printf 'AWS_ACCOUNT_ID=%s\n' "$AWS_ACCOUNT_ID"
            printf 'AWS_REGION=%s\n' "$AWS_REGION"
            printf 'RELEASE_TAG=%s\n' "$INPUT_RELEASE_TAG"
            printf 'RGS_DIGEST=%s\n' "$INPUT_RGS_DIGEST"
            printf 'MIGRATOR_DIGEST=%s\n' "$INPUT_MIGRATOR_DIGEST"
            printf 'WEB_DIGEST=%s\n' "$INPUT_WEB_DIGEST"
            printf 'CONFIGURATION_SHA256=%s\n' "$INPUT_CONFIGURATION_SHA256"
            printf 'DEPLOYMENT_MODE=%s\n' "$INPUT_DEPLOYMENT_MODE"
            printf 'HMAC_EVIDENCE_VERSION_ID=%s\n' "${INPUT_EVIDENCE_VERSION_ID:-none}"
            printf 'HMAC_EVIDENCE_SHA256=%s\n' "${INPUT_EVIDENCE_SHA256:-none}"
          } > "$RELEASE_EVIDENCE/release-identity.env"
          checksum_file="$RUNNER_TEMP/aws-release-evidence-checksums.sha256"
          (cd "$RELEASE_EVIDENCE" && find . -type f ! -name evidence-checksums.sha256 -print0 | \
            LC_ALL=C sort -z | xargs -0 sha256sum > "$checksum_file")
          mv "$checksum_file" "$RELEASE_EVIDENCE/evidence-checksums.sha256"

      - name: 上传只供部署 job 消费的验证证据
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-aws-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_EVIDENCE }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

      - name: 清除临时 runner 中的制品
        if: always()
        run: |
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker image rm \
            "$registry/$AWS_ECR_RGS_RUNTIME_REPOSITORY@$INPUT_RGS_DIGEST" \
            "$registry/$AWS_ECR_RGS_MIGRATOR_REPOSITORY@$INPUT_MIGRATOR_DIGEST" \
            "$registry/$AWS_ECR_WEB_REPOSITORY@$INPUT_WEB_DIGEST" >/dev/null 2>&1 || true
          docker logout "$registry" >/dev/null 2>&1 || true
          rm -rf "$DEPLOYMENT_SOURCE" "$RELEASE_EVIDENCE"

  bind-deployment-artifacts:
    if: github.event_name == 'workflow_dispatch' && !inputs.static_only
    needs:
      - static-contract
      - verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 该 job 不 checkout、不取得 Environment/OIDC/AWS 权限，只用 Actions API 将两个 artifact
    # 的服务端 digest 与本次 run、commit、唯一名称绑定，避免私网部署 job 消费陈旧制品。
    # English: This job does not checkout, does not obtain Environment/OIDC/AWS permissions, and only uses the
    # Actions API to combine the two artifacts. The server-side digest is bound to this run, commit, and unique
    # name to prevent private deployment jobs from consuming stale artifacts.
    permissions:
      actions: read
    env:
      SOURCE_ARTIFACT_ID: ${{ needs.static-contract.outputs.source_artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ needs.static-contract.outputs.source_artifact_digest }}
      EVIDENCE_ARTIFACT_ID: ${{ needs.verify-release.outputs.evidence_artifact_id }}
      EVIDENCE_ARTIFACT_DIGEST: ${{ needs.verify-release.outputs.evidence_artifact_digest }}
    steps:
      - name: 对两个部署 artifact 执行服务端摘要和来源绑定
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_artifact() {
            artifact_id=$1
            artifact_digest=$2
            artifact_name=$3
            metadata="$RUNNER_TEMP/artifact-${artifact_id}.json"
            printf '%s\n' "$artifact_id" | grep -Eq '^[1-9][0-9]*$'
            printf '%s\n' "$artifact_digest" | grep -Eq '^[0-9a-f]{64}$'
            curl --fail --location --show-error --silent --proto '=https' --tlsv1.2 \
              --retry 4 --retry-all-errors \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --output "$metadata"
            jq -e --argjson artifact_id "$artifact_id" \
              --arg digest "sha256:$artifact_digest" --arg name "$artifact_name" \
              --argjson run_id "$GITHUB_RUN_ID" --arg source_sha "$GITHUB_SHA" '
              .id == $artifact_id and .name == $name and .expired == false and
              .digest == $digest and .workflow_run.id == $run_id and
              .workflow_run.head_sha == $source_sha
            ' "$metadata" >/dev/null
            rm -f "$metadata"
          }
          verify_artifact "$SOURCE_ARTIFACT_ID" "$SOURCE_ARTIFACT_DIGEST" \
            "aws-deployment-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          verify_artifact "$EVIDENCE_ARTIFACT_ID" "$EVIDENCE_ARTIFACT_DIGEST" \
            "verified-aws-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  deploy:
    if: github.event_name == 'workflow_dispatch' && !inputs.static_only
    needs:
      - static-contract
      - verify-release
      - bind-deployment-artifacts
    runs-on:
      - self-hosted
      - linux
      - x64
      - ${{ 'slots-aws-private-deployer' }}
    timeout-minutes: 90
    environment:
      name: aws-${{ inputs.target_environment }}-application-deploy
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_APPLICATION_DEPLOY_ROLE_ARN: ${{ vars.AWS_APPLICATION_DEPLOY_ROLE_ARN }}
      AWS_ECR_RGS_RUNTIME_REPOSITORY: ${{ vars.AWS_ECR_RGS_RUNTIME_REPOSITORY }}
      AWS_ECR_RGS_MIGRATOR_REPOSITORY: ${{ vars.AWS_ECR_RGS_MIGRATOR_REPOSITORY }}
      AWS_ECR_WEB_REPOSITORY: ${{ vars.AWS_ECR_WEB_REPOSITORY }}
      AWS_EKS_CLUSTER_NAME: ${{ vars.AWS_EKS_CLUSTER_NAME }}
      AWS_EKS_NAMESPACE: ${{ vars.AWS_EKS_NAMESPACE }}
      AWS_HELM_RELEASE_NAME: ${{ vars.AWS_HELM_RELEASE_NAME }}
      AWS_HELM_VALUES_BUCKET: ${{ vars.AWS_HELM_VALUES_BUCKET }}
      AWS_HELM_VALUES_KEY: ${{ vars.AWS_HELM_VALUES_KEY }}
      AWS_HELM_VALUES_VERSION_ID: ${{ vars.AWS_HELM_VALUES_VERSION_ID }}
      AWS_TERRAFORM_DELIVERY_BUCKET: ${{ vars.AWS_TERRAFORM_DELIVERY_BUCKET }}
      AWS_TERRAFORM_DELIVERY_KEY: ${{ vars.AWS_TERRAFORM_DELIVERY_KEY }}
      AWS_TERRAFORM_DELIVERY_VERSION_ID: ${{ vars.AWS_TERRAFORM_DELIVERY_VERSION_ID }}
      AWS_TERRAFORM_DELIVERY_KMS_KEY_ARN: ${{ vars.AWS_TERRAFORM_DELIVERY_KMS_KEY_ARN }}
      AWS_HMAC_QUIESCE_EVIDENCE_BUCKET: ${{ vars.AWS_HMAC_QUIESCE_EVIDENCE_BUCKET }}
      AWS_HMAC_QUIESCE_EVIDENCE_KEY: ${{ vars.AWS_HMAC_QUIESCE_EVIDENCE_KEY }}
      AWS_HMAC_QUIESCE_EVIDENCE_KMS_KEY_ARN: ${{ vars.AWS_HMAC_QUIESCE_EVIDENCE_KMS_KEY_ARN }}
      AWS_HMAC_QUIESCE_CANCELLATION_PREFIX: ${{ vars.AWS_HMAC_QUIESCE_CANCELLATION_PREFIX }}
      AWS_HMAC_QUIESCE_COMPLETION_PREFIX: ${{ vars.AWS_HMAC_QUIESCE_COMPLETION_PREFIX }}
      AWS_HMAC_QUIESCE_PRODUCER_ROLE_ARN: ${{ vars.AWS_HMAC_QUIESCE_PRODUCER_ROLE_ARN }}
      AWS_HMAC_QUIESCE_PRODUCER_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/aws-hmac-quiesce-evidence.yml@refs/heads/main
      AWS_WEB_BUCKET: ${{ vars.AWS_WEB_BUCKET }}
      AWS_WEB_KMS_KEY_ARN: ${{ vars.AWS_WEB_KMS_KEY_ARN }}
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
      AWS_CLOUDFRONT_DOMAIN_NAME: ${{ vars.AWS_CLOUDFRONT_DOMAIN_NAME }}
      AWS_CLOUDFRONT_RESPONSE_HEADERS_POLICY_ID: ${{ vars.AWS_CLOUDFRONT_RESPONSE_HEADERS_POLICY_ID }}
      AWS_CLOUDFRONT_KVS_ARN: ${{ vars.AWS_CLOUDFRONT_KVS_ARN }}
      AWS_CLOUDFRONT_ROUTER_FUNCTION_NAME: ${{ vars.AWS_CLOUDFRONT_ROUTER_FUNCTION_NAME }}
      INPUT_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      INPUT_RGS_DIGEST: ${{ inputs.rgs_digest }}
      INPUT_MIGRATOR_DIGEST: ${{ inputs.migrator_digest }}
      INPUT_WEB_DIGEST: ${{ inputs.web_digest }}
      INPUT_CONFIGURATION_SHA256: ${{ inputs.configuration_sha256 }}
      INPUT_DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
      INPUT_EVIDENCE_VERSION_ID: ${{ inputs.hmac_quiesce_evidence_version_id }}
      INPUT_EVIDENCE_SHA256: ${{ inputs.hmac_quiesce_evidence_sha256 }}
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
      HELM_VERSION: 3.18.6
      HELM_ARCHIVE_SHA256: 3f43c0aa57243852dd542493a0f54f1396c0bc8ec7296bbb2c01e802010819ce
      DEPLOYMENT_SOURCE: /tmp/slots-aws-deploy-${{ github.run_id }}-${{ github.run_attempt }}/source
      VERIFIED_RELEASE: /tmp/slots-aws-deploy-${{ github.run_id }}-${{ github.run_attempt }}/verified-release
      DEPLOYMENT_EVIDENCE: /tmp/slots-aws-deploy-${{ github.run_id }}-${{ github.run_attempt }}/evidence
    steps:
      - name: 在下载前创建私网 runner 的私有工作目录
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "/tmp/slots-aws-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/downloads"

      - name: 下载精确部署源码和上游验证证据
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.static-contract.outputs.source_artifact_id }},${{ needs.verify-release.outputs.evidence_artifact_id }}
          path: /tmp/slots-aws-deploy-${{ github.run_id }}-${{ github.run_attempt }}/downloads

      - name: 分离两个不可变 artifact 并再次验证全部字节
        run: |
          set -euo pipefail
          downloads="/tmp/slots-aws-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/downloads"
          source_identity=$(find "$downloads" -type f -name source-identity.env -print -quit)
          release_identity=$(find "$downloads" -type f -name release-identity.env -print -quit)
          test -n "$source_identity" -a -n "$release_identity"
          source_root=${source_identity%/source-identity.env}
          release_root=${release_identity%/release-identity.env}
          mv "$source_root" "$DEPLOYMENT_SOURCE"
          mv "$release_root" "$VERIFIED_RELEASE"
          test -z "$(find "$DEPLOYMENT_SOURCE" "$VERIFIED_RELEASE" ! -type d ! -type f -print -quit)"
          (cd "$DEPLOYMENT_SOURCE" && sha256sum --check --strict source-checksums.sha256)
          (cd "$VERIFIED_RELEASE" && sha256sum --check --strict evidence-checksums.sha256)
          for expected in \
            "SOURCE_SHA=$GITHUB_SHA" \
            "WORKFLOW_RUN_ID=$GITHUB_RUN_ID" \
            "WORKFLOW_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            "TARGET_ENVIRONMENT=$INPUT_TARGET_ENVIRONMENT" \
            "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" \
            "AWS_REGION=$AWS_REGION" \
            "RELEASE_TAG=$INPUT_RELEASE_TAG" \
            "RGS_DIGEST=$INPUT_RGS_DIGEST" \
            "MIGRATOR_DIGEST=$INPUT_MIGRATOR_DIGEST" \
            "WEB_DIGEST=$INPUT_WEB_DIGEST" \
            "CONFIGURATION_SHA256=$INPUT_CONFIGURATION_SHA256" \
            "DEPLOYMENT_MODE=$INPUT_DEPLOYMENT_MODE" \
            "HMAC_EVIDENCE_VERSION_ID=${INPUT_EVIDENCE_VERSION_ID:-none}" \
            "HMAC_EVIDENCE_SHA256=${INPUT_EVIDENCE_SHA256:-none}"
          do
            grep -F -x -- "$expected" "$VERIFIED_RELEASE/release-identity.env" >/dev/null
          done
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          for verified_image in \
            "RGS_IMAGE=$registry/$AWS_ECR_RGS_RUNTIME_REPOSITORY@$INPUT_RGS_DIGEST" \
            "MIGRATOR_IMAGE=$registry/$AWS_ECR_RGS_MIGRATOR_REPOSITORY@$INPUT_MIGRATOR_DIGEST" \
            "WEB_IMAGE=$registry/$AWS_ECR_WEB_REPOSITORY@$INPUT_WEB_DIGEST"
          do
            grep -F -x -- "$verified_image" "$VERIFIED_RELEASE/verified-images.env" >/dev/null
          done
          sh "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/validate-environment.sh" application-deploy

      - name: 通过 GitHub OIDC 获取应用部署角色临时凭据
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLICATION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: slots-app-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: 验证账号、集群和版本化 Helm values
        run: |
          set -euo pipefail
          umask 077
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          mkdir -m 0700 "$DEPLOYMENT_EVIDENCE"
          cluster_raw="$RUNNER_TEMP/slots-eks-cluster-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          aws eks describe-cluster --name "$AWS_EKS_CLUSTER_NAME" --output json > "$cluster_raw"
          jq -e '
            .cluster |
            select(.status == "ACTIVE" and
              .resourcesVpcConfig.endpointPrivateAccess == true and
              .resourcesVpcConfig.endpointPublicAccess == false) |
            {cluster: {
              arn: .arn,
              version: .version,
              status: .status,
              endpointPrivateAccess: .resourcesVpcConfig.endpointPrivateAccess,
              endpointPublicAccess: .resourcesVpcConfig.endpointPublicAccess
            }}
          ' "$cluster_raw" > "$DEPLOYMENT_EVIDENCE/eks-cluster.json"
          rm -f "$cluster_raw"
          cluster_arn=$(jq -er '.cluster.arn' "$DEPLOYMENT_EVIDENCE/eks-cluster.json")
          printf '%s\n' "$cluster_arn" | \
            grep -Eq "^arn:aws:eks:${AWS_REGION}:${AWS_ACCOUNT_ID}:cluster/${AWS_EKS_CLUSTER_NAME}$"
          kubernetes_version=$(jq -er '.cluster.version | select(test("^[0-9]+\\.[0-9]+$"))' \
            "$DEPLOYMENT_EVIDENCE/eks-cluster.json")
          values_file="$RUNNER_TEMP/slots-helm-values-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml"
          aws s3api get-object --bucket "$AWS_HELM_VALUES_BUCKET" --key "$AWS_HELM_VALUES_KEY" \
            --version-id "$AWS_HELM_VALUES_VERSION_ID" "$values_file" \
            --output json > "$DEPLOYMENT_EVIDENCE/helm-values-object.json"
          jq -e --arg version "$AWS_HELM_VALUES_VERSION_ID" '.VersionId == $version' \
            "$DEPLOYMENT_EVIDENCE/helm-values-object.json" >/dev/null
          delivery_file="$RUNNER_TEMP/slots-terraform-delivery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          delivery_object="$DEPLOYMENT_EVIDENCE/terraform-delivery-object.json"
          latest_delivery_head="$DEPLOYMENT_EVIDENCE/terraform-delivery-latest-head.json"
          test "$(aws s3api get-bucket-versioning --bucket "$AWS_TERRAFORM_DELIVERY_BUCKET" \
            --query Status --output text)" = Enabled
          aws s3api head-object --bucket "$AWS_TERRAFORM_DELIVERY_BUCKET" \
            --key "$AWS_TERRAFORM_DELIVERY_KEY" --output json > "$latest_delivery_head"
          aws s3api get-object --bucket "$AWS_TERRAFORM_DELIVERY_BUCKET" \
            --key "$AWS_TERRAFORM_DELIVERY_KEY" --version-id "$AWS_TERRAFORM_DELIVERY_VERSION_ID" \
            "$delivery_file" --output json > "$delivery_object"
          "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/verify-latest-terraform-delivery.sh" \
            "$delivery_file" "$delivery_object" "$latest_delivery_head"
          if test "$INPUT_DEPLOYMENT_MODE" = maintenance-complete; then
            hmac_evidence_file="$RUNNER_TEMP/slots-hmac-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/download-hmac-quiesce-evidence.sh" \
              finalize "$hmac_evidence_file"
            "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/hmac-evidence-marker.sh" \
              check all "$hmac_evidence_file"
            chmod 0600 "$hmac_evidence_file"
            printf 'HMAC_EVIDENCE_FILE=%s\n' "$hmac_evidence_file" >> "$GITHUB_ENV"
          fi
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          jq -e --arg target "$INPUT_TARGET_ENVIRONMENT" --arg account "$AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            --arg cluster "$AWS_EKS_CLUSTER_NAME" --arg cluster_arn "$cluster_arn" \
            --arg registry "$registry" \
            --arg rgs "$AWS_ECR_RGS_RUNTIME_REPOSITORY" \
            --arg migrator "$AWS_ECR_RGS_MIGRATOR_REPOSITORY" --arg web "$AWS_ECR_WEB_REPOSITORY" \
            --arg web_bucket "$AWS_WEB_BUCKET" --arg web_kms "$AWS_WEB_KMS_KEY_ARN" \
            --arg distribution "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
            --arg domain "$AWS_CLOUDFRONT_DOMAIN_NAME" \
            --arg policy "$AWS_CLOUDFRONT_RESPONSE_HEADERS_POLICY_ID" \
            --arg kvs "$AWS_CLOUDFRONT_KVS_ARN" \
            --arg router "$AWS_CLOUDFRONT_ROUTER_FUNCTION_NAME" '
            .application_handoff as $handoff |
            .valkey_active_slot as $active_slot |
            .valkey_user_names as $user_names |
            .valkey_password_versions as $password_versions |
            .valkey_rotation_contract as $rotation |
            .valkey_rotation_mode as $rotation_mode |
            (.valkey_secret_name | capture("-v(?<version>[1-9][0-9]*)$").version | tonumber) as $secret_version |
            .environment == $target and .aws_region == $region and
            .aws_account_id == $account and .application_namespace == env.AWS_EKS_NAMESPACE and
            .helm_release_name == env.AWS_HELM_RELEASE_NAME and
            .cluster_name == $cluster and .cluster_arn == $cluster_arn and
            (.alb_access_log_bucket_name | test("^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$")) and
            (.alb_access_log_prefix | test("^[a-z0-9][a-z0-9/_-]{1,127}$")) and
            $handoff.alb_access_logs == {
              "bucket": .alb_access_log_bucket_name, "prefix": .alb_access_log_prefix
            } and
            .ecr_repository_urls["rgs-runtime"] == ($registry + "/" + $rgs) and
            .ecr_repository_urls["rgs-migrator"] == ($registry + "/" + $migrator) and
            .ecr_repository_urls["web-runtime"] == ($registry + "/" + $web) and
            .web_bucket_name == $web_bucket and .web_kms_key_arn == $web_kms and
            .cloudfront_distribution_id == $distribution and
            .cloudfront_distribution_domain_name == $domain and
            .cloudfront_response_headers_policy_id == $policy and
            .cloudfront_release_key_value_store_arn == $kvs and
            .cloudfront_release_request_function_name == $router and
            .cloudfront_release_request_function_arn ==
              ("arn:aws:cloudfront::" + $account + ":function/" + $router) and
            (($router | sub("-release-request$"; "-release-response")) as $response_function |
              $response_function != $router and
              .cloudfront_release_response_function_name == $response_function and
              .cloudfront_release_response_function_arn ==
                ("arn:aws:cloudfront::" + $account + ":function/" + $response_function)) and
            (.cluster_autoscaler_role_arn | startswith("arn:aws:iam::\($account):role/")) and
            (.secret_sync_role_arn | startswith("arn:aws:iam::\($account):role/")) and
            (.amp_writer_role_arn | startswith("arn:aws:iam::\($account):role/")) and
            ($active_slot == "a" or $active_slot == "b") and
            ($user_names | keys | sort) == ["a", "b"] and
            ([$user_names[]] | unique | length) == 2 and
            all($user_names[]; type == "string" and length > 0) and
            .valkey_user_name == $user_names[$active_slot] and
            ($password_versions | keys | sort) == ["a", "b"] and
            all($password_versions[]; type == "number" and . >= 1 and floor == .) and
            $rotation.contract_version == "1.0.0" and
            $rotation.active_slot == $active_slot and
            $rotation.active_user_name == .valkey_user_name and
            $rotation.password_versions == $password_versions and
            $rotation.rotation_mode == $rotation_mode and
            ($rotation_mode == "steady" or $rotation_mode == "password-rotation") and
            .application_release_allowed == true and .maintenance_in_progress == false and
            $rotation.application_release_allowed == true and $rotation.maintenance_in_progress == false and
            ($rotation.password_fingerprints | keys | sort) == ["a", "b"] and
            all($rotation.password_fingerprints[]; type == "string" and test("^[0-9a-f]{64}$")) and
            ($rotation.hmac_key_fingerprint | type == "string" and test("^[0-9a-f]{64}$")) and
            $rotation.published_secret_version == $secret_version and
            $rotation.both_users_remain_in_user_group == true and
            $rotation.old_slot_reset_requires_live_evidence == true and
            $rotation.hmac_bucket_reset_requires_separate_change == true and
            $rotation.hmac_maintenance_requires_zero_replicas == true and
            $rotation.hmac_maintenance_forbids_parallel_rollout == true and
            $rotation.hmac_maintenance_single_attested_plan == true and
            $rotation.hmac_maintenance_exit_requires_separate_plan == true and
            $rotation.hmac_maintenance_attestation_schema == "slots-game/hmac-quiesce-attestation/v1" and
            $rotation.hmac_maintenance_evidence_maximum_ttl_seconds == 3600 and
            $rotation.hmac_maintenance_persistent_lock_name == "slots-hmac-maintenance-lock" and
            $rotation.acl_command_profile == "v2-economic" and
            $rotation.acl_schema_version == "v2" and
            $rotation.acl_schema_transition == "maintenance-quiesced" and
            $rotation.acl_schema_migration_requires_quiesced == true and
            $rotation.acl_schema_rolling_compatible == false and
            $rotation.acl_schema_dual_permissions_allowed == false and
            $rotation.acl_schema_migration_order == [
              "stop-new-intents", "drain-old-api-pods", "apply-v2-acl",
              "start-v2-runtime", "verify-v2-shared-admission", "resume-new-intents"
            ] and
            $rotation.hmac_maintenance_target_identity == {
              environment: $target, aws_account_id: $account, aws_region: $region,
              eks_cluster_name: $cluster, kubernetes_namespace: env.AWS_EKS_NAMESPACE,
              helm_release_name: env.AWS_HELM_RELEASE_NAME
            } and
            (($active_slot == "a" and ($secret_version % 2) == 1) or
              ($active_slot == "b" and ($secret_version % 2) == 0)) and
            $handoff.contract_version == "1.0.0" and
            $handoff.foundation_apply_is_application_ready == false and
            $handoff.application_namespace == env.AWS_EKS_NAMESPACE and
            $handoff.helm_release_name == env.AWS_HELM_RELEASE_NAME and
            $handoff.application_release_allowed == true and $handoff.maintenance_in_progress == false and
            $handoff.cluster_autoscaler_inline_policy_name == .cluster_autoscaler_inline_policy_name and
            (.cluster_autoscaler_inline_policy_name | type == "string" and length > 0) and
            $handoff.private_vpc_runner_required == true and
            $handoff.live_gate_script == "deploy/aws-production/verify-live-platform-prerequisites.sh" and
            ($handoff.addon_versions | keys | sort) == [
              "aws-load-balancer-controller",
              "cluster-autoscaler",
              "external-secrets",
              "kube-prometheus-stack",
              "prometheus-agent"
            ] and
            all($handoff.addon_versions[];
              type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$")
            ) and
            ($handoff.kubernetes_version | test("^[0-9]+\\.[0-9]+$")) and
            ($handoff.cluster_autoscaler_image_tag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$") and
              startswith("v\($handoff.kubernetes_version).")) and
            ($handoff.metrics_server_addon_version |
              test("^v[0-9]+\\.[0-9]+\\.[0-9]+-eksbuild\\.[0-9]+$")) and
            ($handoff.vpc_cni_network_policy | keys | sort) ==
              ["addon_name", "addon_version", "configuration_values", "expected_status", "pod_identity"] and
            $handoff.vpc_cni_network_policy.addon_name == "vpc-cni" and
            ($handoff.vpc_cni_network_policy.addon_version |
              test("^v[0-9]+\\.[0-9]+\\.[0-9]+-eksbuild\\.[0-9]+$")) and
            $handoff.vpc_cni_network_policy.expected_status == "ACTIVE" and
            $handoff.vpc_cni_network_policy.configuration_values == {"enableNetworkPolicy": "true"} and
            $handoff.vpc_cni_network_policy.pod_identity.namespace == "kube-system" and
            $handoff.vpc_cni_network_policy.pod_identity.service_account == "aws-node" and
            ($handoff.vpc_cni_network_policy.pod_identity.role_arn |
              startswith("arn:aws:iam::\($account):role/")) and
            ($handoff.cloudwatch_observability.addon_version |
              test("^v[0-9]+\\.[0-9]+\\.[0-9]+-eksbuild\\.[0-9]+$")) and
            $handoff.cloudwatch_observability.configuration_values.containerLogs.enabled == true and
            $handoff.cloudwatch_observability == {
              "addon_name": "amazon-cloudwatch-observability",
              "addon_version": $handoff.cloudwatch_observability.addon_version,
              "expected_status": "ACTIVE",
              "configuration_values": {
                "agent": {"config": {"logs": {"metrics_collected": {"kubernetes": {
                  "enhanced_container_insights": true
                }}}}},
                "containerLogs": {"enabled": true}
              },
              "pod_identity": {
                "namespace": "amazon-cloudwatch",
                "service_account": "cloudwatch-agent",
                "role_arn": $handoff.cloudwatch_observability.pod_identity.role_arn
              },
              "workloads": [
                {"namespace": "amazon-cloudwatch", "kind": "DaemonSet", "name": "cloudwatch-agent",
                  "minimum_pods": 1, "service_account": "cloudwatch-agent", "container_name": "cloudwatch-agent"},
                {"namespace": "amazon-cloudwatch", "kind": "DaemonSet", "name": "fluent-bit",
                  "minimum_pods": 1, "service_account": "fluent-bit", "container_name": "fluent-bit"}
              ]
            } and
            ($handoff.cloudwatch_observability.pod_identity.role_arn |
              startswith("arn:aws:iam::\($account):role/")) and
            $handoff.required_deployments == {
              "aws_load_balancer_controller": "kube-system/aws-load-balancer-controller",
              "cluster_autoscaler": "kube-system/cluster-autoscaler",
              "external_secrets": "external-secrets/external-secrets",
              "kube_state_metrics": "monitoring/kube-prometheus-stack-kube-state-metrics",
              "metrics_server": "kube-system/metrics-server",
              "prometheus_operator": "monitoring/kube-prometheus-stack-operator"
            } and
            $handoff.required_api_services == {"resource_metrics": "v1beta1.metrics.k8s.io"} and
            $handoff.kube_state_metrics_release_name == "kube-prometheus-stack"
          ' "$delivery_file" >/dev/null
          if test "$INPUT_DEPLOYMENT_MODE" = maintenance-complete; then
            active_web="$DEPLOYMENT_EVIDENCE/hmac-maintenance-active-web.json"
            aws cloudfront-keyvaluestore get-key --kvs-arn "$AWS_CLOUDFRONT_KVS_ARN" \
              --key active-release --output json > "$active_web"
            jq -e --arg digest "$INPUT_WEB_DIGEST" '
              .Key == "active-release" and .Value == $digest
            ' "$active_web" >/dev/null || {
              printf '%s\n' 'maintenance-complete 的 Web digest 必须等于当前 active-release，且禁止切换 Web' >&2
              exit 1
            }
          fi
          chmod 0600 "$values_file" "$delivery_file" "$delivery_object"
          {
            printf 'HELM_VALUES_FILE=%s\n' "$values_file"
            printf 'EKS_KUBERNETES_VERSION=%s.0\n' "$kubernetes_version"
            printf 'TERRAFORM_DELIVERY_FILE=%s\n' "$delivery_file"
          } >> "$GITHUB_ENV"

      - name: 使用临时凭据登录固定 ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}
          mask-password: true

      - name: 重新确认三个摘要仍存在于固定仓库
        run: |
          set -euo pipefail
          for pair in \
            "$AWS_ECR_RGS_RUNTIME_REPOSITORY:$INPUT_RGS_DIGEST" \
            "$AWS_ECR_RGS_MIGRATOR_REPOSITORY:$INPUT_MIGRATOR_DIGEST" \
            "$AWS_ECR_WEB_REPOSITORY:$INPUT_WEB_DIGEST"
          do
            repository=${pair%%:sha256:*}
            digest="sha256:${pair##*:sha256:}"
            actual=$(aws ecr describe-images --repository-name "$repository" \
              --image-ids "imageDigest=$digest" --query 'imageDetails[0].imageDigest' --output text)
            test "$actual" = "$digest"
          done

      - name: 安装校验和固定的 Helm
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/aws-deployment-tools"
          archive="$RUNNER_TEMP/helm-linux-amd64.tar.gz"
          mkdir -p "$tools_dir"
          curl --fail --location --show-error --silent --proto '=https' --tlsv1.2 \
            --retry 4 --retry-all-errors \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" --output "$archive"
          printf '%s  %s\n' "$HELM_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$tools_dir" \
            --strip-components=1 linux-amd64/helm
          chmod 0555 "$tools_dir/helm"
          printf 'HELM_BIN=%s\n' "$tools_dir/helm" >> "$GITHUB_ENV"

      - name: 在私网 runner 执行 Terraform 交接、Secret 同步和平台实时门禁
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null 2>&1
          kubeconfig="$RUNNER_TEMP/slots-kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws eks update-kubeconfig --name "$AWS_EKS_CLUSTER_NAME" --region "$AWS_REGION" \
            --kubeconfig "$kubeconfig"
          chmod 0600 "$kubeconfig"
          export KUBECONFIG="$kubeconfig"
          expected_cluster_arn="arn:aws:eks:${AWS_REGION}:${AWS_ACCOUNT_ID}:cluster/${AWS_EKS_CLUSTER_NAME}"
          current_cluster=$(kubectl config view --minify --output 'jsonpath={.clusters[0].name}')
          test "$current_cluster" = "$expected_cluster_arn" || {
            printf '%s\n' '当前 kubeconfig 未指向 Terraform 交接声明的 EKS 集群' >&2
            exit 1
          }
          test "$(kubectl get --raw=/readyz)" = ok || {
            printf '%s\n' '目标 EKS API 尚未就绪' >&2
            exit 1
          }
          if test "$INPUT_DEPLOYMENT_MODE" = standard; then
            "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/hmac-application-maintenance-gate.sh" \
              standard
          else
            test "$INPUT_DEPLOYMENT_MODE" = maintenance-complete
            finalize_attestation="$DEPLOYMENT_EVIDENCE/hmac-finalize-attestation.json"
            "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/hmac-application-maintenance-gate.sh" \
              locked "$TERRAFORM_DELIVERY_FILE" "$HMAC_EVIDENCE_FILE" "$finalize_attestation"
            ruby "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/verify-hmac-finalize-attestation.rb" \
              "$finalize_attestation" "$TERRAFORM_DELIVERY_FILE" "$HMAC_EVIDENCE_FILE"
            printf 'HMAC_FINALIZE_ATTESTATION_FILE=%s\n' "$finalize_attestation" >> "$GITHUB_ENV"
          fi
          external_secrets="$DEPLOYMENT_EVIDENCE/external-secrets.yaml"
          ruby "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/render-external-secrets.rb" \
            "$TERRAFORM_DELIVERY_FILE" "$AWS_EKS_NAMESPACE" > "$external_secrets"
          ruby -ryaml -e '
            documents = YAML.load_stream(File.binread(ARGV.fetch(0))).compact
            kinds = documents.map { |document| document.fetch("kind") }
            abort "External Secrets 渲染集合不完整" unless
              kinds.count("Namespace") == 1 && kinds.count("SecretStore") == 1 &&
                kinds.count("ExternalSecret") == 6 && kinds.length == 8
            abort "同步 manifest 不得携带原生 Secret 值" if kinds.include?("Secret")
          ' "$external_secrets"
          kubectl apply --server-side --field-manager=slots-aws-delivery \
            --filename "$external_secrets" >/dev/null
          sh "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/verify-live-platform-prerequisites.sh" \
            "$TERRAFORM_DELIVERY_FILE" "$AWS_EKS_NAMESPACE"
          sh "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/verify-live-application-secrets.sh" \
            "$HELM_VALUES_FILE" \
            "$DEPLOYMENT_SOURCE/slots-game/deploy/cluster-production/chart/values.yaml" \
            "$AWS_EKS_NAMESPACE" "$TERRAFORM_DELIVERY_FILE"
          printf 'KUBECONFIG=%s\n' "$kubeconfig" >> "$GITHUB_ENV"

      - name: 以 atomic 和 wait 方式发布 RGS 与 Migrator
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          rgs_image="$registry/$AWS_ECR_RGS_RUNTIME_REPOSITORY@$INPUT_RGS_DIGEST"
          migrator_image="$registry/$AWS_ECR_RGS_MIGRATOR_REPOSITORY@$INPUT_MIGRATOR_DIGEST"
          chart="$DEPLOYMENT_SOURCE/slots-game/deploy/cluster-production/chart"
          common_arguments=(--namespace "$AWS_EKS_NAMESPACE" --values "$HELM_VALUES_FILE")
          image_arguments=(
            --set-string "images.rgs.repository=$registry/$AWS_ECR_RGS_RUNTIME_REPOSITORY"
            --set-string "images.rgs.digest=$INPUT_RGS_DIGEST"
            --set-string "images.migrator.repository=$registry/$AWS_ECR_RGS_MIGRATOR_REPOSITORY"
            --set-string "images.migrator.digest=$INPUT_MIGRATOR_DIGEST"
          )
          api_runtime_assets_secret=$(jq -er '.application_secret_names["api-runtime-assets"]' \
            "$TERRAFORM_DELIVERY_FILE")
          worker_runtime_assets_secret=$(jq -er '.application_secret_names["worker-runtime-assets"]' \
            "$TERRAFORM_DELIVERY_FILE")
          shared_admission_secret=$(jq -er '.valkey_secret_name' "$TERRAFORM_DELIVERY_FILE")
          requested_values_render="$DEPLOYMENT_EVIDENCE/helm-rendered-requested-values.yaml"
          "$HELM_BIN" template "$AWS_HELM_RELEASE_NAME" "$chart" \
            --namespace "$AWS_EKS_NAMESPACE" --kube-version "$EKS_KUBERNETES_VERSION" \
            --values "$HELM_VALUES_FILE" --is-upgrade "${image_arguments[@]}" > "$requested_values_render"
          ruby -ryaml -e '
            documents = YAML.load_stream(File.binread(ARGV.fetch(0))).compact
            api = documents.select { |item| item.is_a?(Hash) && item["kind"] == "Deployment" &&
              item.dig("metadata", "labels", "app.kubernetes.io/component") == "rgs" }
            abort "用户 values 的 API Deployment 数量不精确" unless api.length == 1
            abort "用户 values 禁止自行启用 rgs.maintenanceQuiesced" unless
              api.first.dig("spec", "template", "metadata", "annotations",
                "slots-game.io/hmac-maintenance-quiesced") == "false"
          ' "$requested_values_render"
          "$HELM_BIN" lint --strict "$chart" --namespace "$AWS_EKS_NAMESPACE" \
            --values "$HELM_VALUES_FILE" \
            "${image_arguments[@]}" --set rgs.maintenanceQuiesced=false
          for phase in install upgrade; do
            rendered="$DEPLOYMENT_EVIDENCE/helm-rendered-${phase}.yaml"
            phase_arguments=()
            if test "$phase" = upgrade; then
              phase_arguments+=(--is-upgrade)
            fi
            "$HELM_BIN" template "$AWS_HELM_RELEASE_NAME" "$chart" \
              --namespace "$AWS_EKS_NAMESPACE" --kube-version "$EKS_KUBERNETES_VERSION" \
              --values "$HELM_VALUES_FILE" "${phase_arguments[@]}" \
              "${image_arguments[@]}" --set rgs.maintenanceQuiesced=false > "$rendered"
            ruby "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/verify-rendered-release.rb" \
              "$rendered" "$rgs_image" "$migrator_image" "$AWS_EKS_NAMESPACE" \
              "$api_runtime_assets_secret" "$worker_runtime_assets_secret" "$shared_admission_secret"
          done
          sh "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/verify-live-definition-identity.sh" \
            "$HELM_VALUES_FILE" "$chart/values.yaml" "$AWS_EKS_NAMESPACE" \
            "$AWS_HELM_RELEASE_NAME" "$DEPLOYMENT_EVIDENCE/helm-rendered-upgrade.yaml"
          if test "$INPUT_DEPLOYMENT_MODE" = maintenance-complete; then
            safe_rendered="$DEPLOYMENT_EVIDENCE/helm-rendered-maintenance-quiesced.yaml"
            "$HELM_BIN" template "$AWS_HELM_RELEASE_NAME" "$chart" \
              --namespace "$AWS_EKS_NAMESPACE" --kube-version "$EKS_KUBERNETES_VERSION" \
              --values "$HELM_VALUES_FILE" --is-upgrade "${image_arguments[@]}" \
              --set rgs.maintenanceQuiesced=true > "$safe_rendered"
            current_manifest="$DEPLOYMENT_EVIDENCE/helm-current-manifest.yaml"
            current_hooks="$DEPLOYMENT_EVIDENCE/helm-current-hooks.yaml"
            "$HELM_BIN" get manifest "$AWS_HELM_RELEASE_NAME" --namespace "$AWS_EKS_NAMESPACE" > \
              "$current_manifest"
            "$HELM_BIN" get hooks "$AWS_HELM_RELEASE_NAME" --namespace "$AWS_EKS_NAMESPACE" > \
              "$current_hooks"
            old_secret_version=$(jq -er '.rotation.observed_secret_version' "$HMAC_EVIDENCE_FILE")
            ruby "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/verify-hmac-only-release-diff.rb" \
              safe "$current_manifest" "$current_hooks" "$safe_rendered" \
              "$shared_admission_secret" "$old_secret_version" "$HMAC_EVIDENCE_FILE"
            ruby "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/verify-hmac-only-release-diff.rb" \
              active "$current_manifest" "$current_hooks" \
              "$DEPLOYMENT_EVIDENCE/helm-rendered-upgrade.yaml" \
              "$shared_admission_secret" "$old_secret_version" "$HMAC_EVIDENCE_FILE"
            ruby "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/verify-hmac-finalize-attestation.rb" \
              "$HMAC_FINALIZE_ATTESTATION_FILE" "$TERRAFORM_DELIVERY_FILE" "$HMAC_EVIDENCE_FILE"
            "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/hmac-application-maintenance-gate.sh" \
              pre "$TERRAFORM_DELIVERY_FILE" "$HMAC_EVIDENCE_FILE" \
              "$safe_rendered"
            phase_a_before="$DEPLOYMENT_EVIDENCE/helm-status-before-phase-a.json"
            phase_a_after="$DEPLOYMENT_EVIDENCE/helm-status-after-phase-a.json"
            "$HELM_BIN" status "$AWS_HELM_RELEASE_NAME" --namespace "$AWS_EKS_NAMESPACE" \
              --output json > "$phase_a_before"
            phase_a_revision=$(jq -er '.version | select(type == "number" and . >= 1 and floor == .)' \
              "$phase_a_before")
            touch "$DEPLOYMENT_EVIDENCE/maintenance-phase-a-started"
            # Phase A 故意不使用 atomic/rollback；其唯一 API 形态是 target Secret、零副本且无 HPA。
            "$HELM_BIN" upgrade "$AWS_HELM_RELEASE_NAME" "$chart" \
              "${common_arguments[@]}" --no-hooks --wait --timeout 20m \
              "${image_arguments[@]}" --set rgs.maintenanceQuiesced=true
            "$HELM_BIN" status "$AWS_HELM_RELEASE_NAME" --namespace "$AWS_EKS_NAMESPACE" \
              --output json > "$phase_a_after"
            jq -e --argjson before "$phase_a_revision" '
              .info.status == "deployed" and .version == ($before + 1)
            ' "$phase_a_after" >/dev/null || {
              printf '%s\n' 'Phase A Helm 安全 revision 未精确提交' >&2
              exit 1
            }
            "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/hmac-application-maintenance-gate.sh" \
              phase-a "$TERRAFORM_DELIVERY_FILE" "$HMAC_EVIDENCE_FILE"
            touch "$DEPLOYMENT_EVIDENCE/maintenance-phase-a-complete"
            # Phase B 的 atomic 失败只会回滚到刚提交的安全 revision，不会恢复旧 HMAC Pod。
            # English: An atomic failure in Phase B will only roll back to the newly submitted safe revision and
            # will not restore the old HMAC Pod.
            "$HELM_BIN" upgrade "$AWS_HELM_RELEASE_NAME" "$chart" \
              "${common_arguments[@]}" --no-hooks --atomic --wait --timeout 20m \
              "${image_arguments[@]}" --set rgs.maintenanceQuiesced=false
          else
            test "$INPUT_DEPLOYMENT_MODE" = standard
            "$HELM_BIN" upgrade --install "$AWS_HELM_RELEASE_NAME" "$chart" \
              "${common_arguments[@]}" --create-namespace --atomic --wait --wait-for-jobs --timeout 20m \
              "${image_arguments[@]}" --set rgs.maintenanceQuiesced=false
          fi
          "$HELM_BIN" status "$AWS_HELM_RELEASE_NAME" --namespace "$AWS_EKS_NAMESPACE" --output json > \
            "$DEPLOYMENT_EVIDENCE/helm-status.json"
          sh "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/verify-live-alb-edge.sh" \
            "$TERRAFORM_DELIVERY_FILE" "$AWS_EKS_NAMESPACE"
          sh "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/verify-live-platform-prerequisites.sh" \
            "$TERRAFORM_DELIVERY_FILE" "$AWS_EKS_NAMESPACE"
          if test "$INPUT_DEPLOYMENT_MODE" = maintenance-complete; then
            "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/hmac-application-maintenance-gate.sh" \
              post "$TERRAFORM_DELIVERY_FILE" "$HMAC_EVIDENCE_FILE"
          fi

      - name: maintenance-complete 失败后重新锁定 API 零副本
        if: failure() && inputs.deployment_mode == 'maintenance-complete'
        run: |
          set -euo pipefail
          if test -f "$DEPLOYMENT_EVIDENCE/maintenance-phase-a-started"; then
            relock_mode=relock
            if test -f "$DEPLOYMENT_EVIDENCE/maintenance-phase-a-complete"; then
              relock_mode=relock-target
            fi
            "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/hmac-application-maintenance-gate.sh" \
              "$relock_mode" "$TERRAFORM_DELIVERY_FILE" "$HMAC_EVIDENCE_FILE"
          fi

      - name: 从已验证 Web digest 提取并发布不可变 release
        if: inputs.deployment_mode == 'standard'
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          web_image="$registry/$AWS_ECR_WEB_REPOSITORY@$INPUT_WEB_DIGEST"
          docker pull "$web_image" >/dev/null
          static_root="$RUNNER_TEMP/slots-web-static-root"
          extraction_evidence="$RUNNER_TEMP/slots-web-extraction-evidence"
          sh "$DEPLOYMENT_SOURCE/slots-game/deploy/supply-chain/extract-aws-web-static-root.sh" \
            "$web_image" "$static_root" "$extraction_evidence" "$INPUT_CONFIGURATION_SHA256"
          ruby "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/verify-web-rgs-origin.rb" \
            "$TERRAFORM_DELIVERY_FILE" "$AWS_EKS_NAMESPACE" "$extraction_evidence"
          sh "$DEPLOYMENT_SOURCE/slots-game/deploy/aws-production/workflow/publish-web-release.sh" \
            "$static_root" "$extraction_evidence" "$web_image" "$INPUT_CONFIGURATION_SHA256" \
            "$DEPLOYMENT_EVIDENCE/web"
          cp -R "$extraction_evidence" "$DEPLOYMENT_EVIDENCE/web-extraction"

      - name: 上传部署与切换证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-deployment-evidence-${{ inputs.target_environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEPLOYMENT_EVIDENCE }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

      - name: 清除自托管 runner 中的部署临时文件
        if: always()
        run: |
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker image rm "$registry/$AWS_ECR_WEB_REPOSITORY@$INPUT_WEB_DIGEST" >/dev/null 2>&1 || true
          docker logout "$registry" >/dev/null 2>&1 || true
          rm -rf "/tmp/slots-aws-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/slots-web-static-root" "$RUNNER_TEMP/slots-web-extraction-evidence" \
            "$RUNNER_TEMP/slots-helm-values-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml" \
            "$RUNNER_TEMP/slots-terraform-delivery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            "$RUNNER_TEMP/slots-kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/slots-eks-cluster-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            "$RUNNER_TEMP/aws-deployment-tools" "$RUNNER_TEMP/helm-linux-amd64.tar.gz"
