name: Supply-chain release attestation and signing

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Exact lowercase HTTPS registry host, without scheme or path
        required: true
        type: string
      image_repository:
        description: Exact image repository without tag or digest (registry/namespace/name)
        required: true
        type: string
      artifact:
        description: Release image target to build from this protected source tag
        required: true
        type: choice
        options:
          - rgs-runtime
          - rgs-migrator
          - web-runtime
      image_tag:
        description: Final OCI tag; must exactly match the protected Git tag name
        required: true
        type: string
      rgs_base_url:
        description: Web runtime only; exact production HTTPS RGS base URL
        required: false
        type: string
      rgs_bet_options_minor:
        description: Web runtime only; canonical comma-separated positive minor-unit bets
        required: false
        type: string
      rgs_default_bet_minor:
        description: Web runtime only; default minor-unit bet included in the options
        required: false
        type: string
      rgs_host_origin:
        description: Web runtime only; exact production HTTPS host origin
        required: false
        type: string
      expected_certificate_identity:
        description: Exact GitHub workflow identity for this protected release tag
        required: true
        type: string
      expected_oidc_issuer:
        description: Exact approved OIDC issuer; GitHub Actions uses https://token.actions.githubusercontent.com
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ format('slots-supply-chain-release-{0}-{1}', inputs.image_repository, inputs.image_tag) }}
  cancel-in-progress: false

jobs:
  verify-source-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 本 job 执行仓库代码与第三方依赖，故意不绑定 Environment，也没有 OIDC、attestation、
    # Registry 凭据或素材审批 secret；即使依赖被利用，也拿不到发布身份。
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.conformance.outputs.source_sha }}
    defaults:
      run:
        working-directory: slots-game
    env:
      SUPPLY_CHAIN_REGISTRY: ${{ inputs.registry }}
      SUPPLY_CHAIN_IMAGE_REPOSITORY: ${{ inputs.image_repository }}
      SUPPLY_CHAIN_ARTIFACT: ${{ inputs.artifact }}
      SUPPLY_CHAIN_IMAGE_TAG: ${{ inputs.image_tag }}
      SUPPLY_CHAIN_EXPECTED_CERTIFICATE_IDENTITY: ${{ inputs.expected_certificate_identity }}
      SUPPLY_CHAIN_EXPECTED_OIDC_ISSUER: ${{ inputs.expected_oidc_issuer }}
      SUPPLY_CHAIN_REPORT_DIR: /tmp/slots-release-verify-${{ github.run_id }}-${{ github.run_attempt }}
      RGS_CONFORMANCE_ARTIFACT_DIR: /tmp/slots-release-verify-${{ github.run_id }}-${{ github.run_attempt }}/postgres-conformance
      RGS_RUNTIME_SMOKE_ARTIFACT_DIR: /tmp/slots-release-verify-${{ github.run_id }}-${{ github.run_attempt }}/runtime-smoke
      RGS_BASE_URL: ${{ inputs.rgs_base_url }}
      RGS_BET_OPTIONS_MINOR: ${{ inputs.rgs_bet_options_minor }}
      RGS_DEFAULT_BET_MINOR: ${{ inputs.rgs_default_bet_minor }}
      RGS_HOST_ORIGIN: ${{ inputs.rgs_host_origin }}
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: rgs_release_conformance
      PGUSER: rgs_release_conformance
      PGPASSWORD: release-conformance-${{ github.run_id }}-${{ github.run_attempt }}
      RGS_MIGRATOR_PASSWORD: release-migrator-${{ github.run_id }}-${{ github.run_attempt }}
      RGS_RUNTIME_PASSWORD: release-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      HELM_VERSION: 3.18.6
      HELM_ARCHIVE_SHA256: 3f43c0aa57243852dd542493a0f54f1396c0bc8ec7296bbb2c01e802010819ce
      KUBECONFORM_VERSION: 0.7.0
      KUBECONFORM_ARCHIVE_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: rgs_release_conformance
          POSTGRES_USER: rgs_release_conformance
          POSTGRES_PASSWORD: release-conformance-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rgs_release_conformance -d rgs_release_conformance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out protected release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Validate protected release identity inputs
        run: ./deploy/supply-chain/release-sign.sh validate-build

      - name: Require clean protected source tree
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Scan the clean release source and regenerate dual-format SBOM
        # 必须位于所有 setup、npm ci 与 build 之前，避免 node_modules/dist 污染源码证据。
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-release-source-cache
        run: ./deploy/supply-chain/scan.sh source "$SUPPLY_CHAIN_REPORT_DIR/source"

      - name: Set up reviewed Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.6
          cache-dependency-path: slots-game/server/go.sum

      - name: Set up reviewed Node.js toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: slots-game/web/package-lock.json

      - name: Install checksum-pinned deployment conformance tools
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/cluster-tools"
          helm_bin="${tools_dir}/helm"
          kubeconform_bin="${tools_dir}/kubeconform"
          mkdir -p "$tools_dir"

          helm_archive="${RUNNER_TEMP}/helm-linux-amd64.tar.gz"
          curl --fail --location --show-error --silent --proto '=https' --tlsv1.2 \
            --retry 4 --retry-all-errors \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" \
            --output "$helm_archive"
          printf '%s  %s\n' "$HELM_ARCHIVE_SHA256" "$helm_archive" | sha256sum --check --strict
          tar --extract --gzip --file "$helm_archive" --directory "$tools_dir" \
            --strip-components=1 linux-amd64/helm

          kubeconform_archive="${RUNNER_TEMP}/kubeconform-linux-amd64.tar.gz"
          curl --fail --location --show-error --silent --proto '=https' --tlsv1.2 \
            --retry 4 --retry-all-errors \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "$kubeconform_archive"
          printf '%s  %s\n' "$KUBECONFORM_ARCHIVE_SHA256" "$kubeconform_archive" | sha256sum --check --strict
          tar --extract --gzip --file "$kubeconform_archive" --directory "$tools_dir" kubeconform
          chmod 0555 "$helm_bin" "$kubeconform_bin"
          "$helm_bin" version --short
          "$kubeconform_bin" -v
          {
            printf 'HELM_BIN=%s\n' "$helm_bin"
            printf 'KUBECONFORM_BIN=%s\n' "$kubeconform_bin"
            printf 'TMPDIR=%s\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Re-run local and cluster production deployment contracts
        run: make verify-deployment-contracts

      - name: Parse rendered cluster alert rules with fixed promtool
        run: make verify-cluster-prometheus-rules

      - name: Install exact frontend dependency lock
        working-directory: slots-game/web
        run: npm ci

      - name: Verify streaming package manifests
        working-directory: slots-game/web
        run: npm run assets:check-streaming-packages

      - name: Re-run complete source conformance on this protected tag
        # make verify 固定包含前后端全量测试、race、vet、build 与供应链静态契约。
        run: make verify

      - name: Re-run deterministic frontend production build on this protected tag
        working-directory: slots-game/web
        run: npm run build:determinism-check

      - name: Confirm release PostgreSQL readiness
        run: pg_isready --host 127.0.0.1 --port 5432 --username rgs_release_conformance --dbname rgs_release_conformance

      - name: Bootstrap isolated release-conformance database roles
        run: |
          POSTGRES_USER="$PGUSER" POSTGRES_DB="$PGDATABASE" \
            ./deploy/postgres/init/001-roles.sh

      - name: Configure ephemeral release-conformance DSNs
        shell: bash
        run: |
          printf 'RGS_POSTGRES_TEST_URL=postgres://%s:%s@%s:%s/%s?sslmode=disable\n' \
            "rgs_runtime" "$RGS_RUNTIME_PASSWORD" "$PGHOST" "$PGPORT" "$PGDATABASE" >> "$GITHUB_ENV"
          printf 'RGS_POSTGRES_MIGRATOR_TEST_URL=postgres://%s:%s@%s:%s/%s?sslmode=disable\n' \
            "rgs_migrator" "$RGS_MIGRATOR_PASSWORD" "$PGHOST" "$PGPORT" "$PGDATABASE" >> "$GITHUB_ENV"

      - name: Re-run PostgreSQL backend conformance on this protected tag
        run: make test-postgres

      - name: Build isolated runtime targets for production-configuration smoke
        run: |
          set -euo pipefail
          docker build --file deploy/Dockerfile --target runtime --tag slots-rgs-runtime:conformance .
          docker build --file deploy/Dockerfile --target migrator --tag slots-rgs-migrator:conformance .

      - name: Re-run production-configuration fail-closed runtime smoke
        # 仅使用短命 CI-only v2 审批与 TLS 材料，不能替代真实生产/监管审批。
        env:
          RGS_RUNTIME_SMOKE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: make smoke-runtime-production

      - name: Build and exercise exact cluster production images
        env:
          CLUSTER_RUNTIME_IMAGE: slots-rgs-cluster-runtime:conformance
          CLUSTER_MIGRATOR_IMAGE: slots-rgs-cluster-migrator:conformance
        run: make verify-cluster-image-contract

      - name: Record exact source conformance result
        id: conformance
        run: |
          set -euo pipefail
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_SHA=%s\nSOURCE_REF=%s\nARTIFACT=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$SUPPLY_CHAIN_ARTIFACT" > \
            "$SUPPLY_CHAIN_REPORT_DIR/source-conformance.env"

      - name: Upload unprivileged verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/source/**/*.json
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/source/**/*.jsonl
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/source/**/*.txt
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/source/**/*.sha256
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/source/**/*.env
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/postgres-conformance/**/*
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/runtime-smoke/**/*
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/source-conformance.env
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  build-rgs:
    needs: verify-source-conformance
    if: inputs.artifact != 'web-runtime' && needs.verify-source-conformance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # fresh checkout 与测试 job 隔离；本 job 不运行宿主依赖脚本，也没有 Environment/OIDC/secret。
    permissions:
      contents: read
    outputs:
      source_tree_sha: ${{ steps.context.outputs.source_tree_sha }}
      artifact_id: ${{ steps.upload-rgs-bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-rgs-bundle.outputs.artifact-digest }}
      bundle_manifest_sha256: ${{ steps.finalize-rgs.outputs.bundle_manifest_sha256 }}
      bundle_checksums_sha256: ${{ steps.finalize-rgs.outputs.bundle_checksums_sha256 }}
      oci_archive_sha256: ${{ steps.finalize-rgs.outputs.oci_archive_sha256 }}
      spdx_sha256: ${{ steps.finalize-rgs.outputs.spdx_sha256 }}
      configuration_sha256: ${{ steps.finalize-rgs.outputs.configuration_sha256 }}
      approval_expires_at: ${{ steps.finalize-rgs.outputs.approval_expires_at }}
      approval_metadata_sha256: ${{ steps.finalize-rgs.outputs.approval_metadata_sha256 }}
    defaults:
      run:
        working-directory: slots-game
    env:
      SUPPLY_CHAIN_REGISTRY: ${{ inputs.registry }}
      SUPPLY_CHAIN_IMAGE_REPOSITORY: ${{ inputs.image_repository }}
      SUPPLY_CHAIN_ARTIFACT: ${{ inputs.artifact }}
      SUPPLY_CHAIN_IMAGE_TAG: ${{ inputs.image_tag }}
      SUPPLY_CHAIN_EXPECTED_CERTIFICATE_IDENTITY: ${{ inputs.expected_certificate_identity }}
      SUPPLY_CHAIN_EXPECTED_OIDC_ISSUER: ${{ inputs.expected_oidc_issuer }}
      SUPPLY_CHAIN_REPORT_DIR: /tmp/slots-release-rgs-${{ github.run_id }}-${{ github.run_attempt }}
      RGS_BASE_URL: ${{ inputs.rgs_base_url }}
      RGS_BET_OPTIONS_MINOR: ${{ inputs.rgs_bet_options_minor }}
      RGS_DEFAULT_BET_MINOR: ${{ inputs.rgs_default_bet_minor }}
      RGS_HOST_ORIGIN: ${{ inputs.rgs_host_origin }}

    steps:
      - name: Fresh checkout of the exact conformed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Bind the real clean build context tree
        id: context
        run: |
          set -euo pipefail
          test "${{ needs.verify-source-conformance.outputs.source_sha }}" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          source_tree_sha=$(git rev-parse "$GITHUB_SHA^{tree}")
          printf '%s\n' "$source_tree_sha" | grep -Eq '^[0-9a-f]{40}$'
          printf 'SOURCE_TREE_SHA=%s\n' "$source_tree_sha" >> "$GITHUB_ENV"
          printf 'source_tree_sha=%s\n' "$source_tree_sha" >> "$GITHUB_OUTPUT"
          ./deploy/supply-chain/release-sign.sh validate-build

      - name: Set up reviewed Buildx and digest-pinned BuildKit
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.34.1
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          buildkitd-flags: --debug=false
          install: true

      - name: Build exact RGS result from the fresh context as an OCI archive
        run: |
          set -euo pipefail
          mkdir -p "$SUPPLY_CHAIN_REPORT_DIR/bundle"
          local_ref="slots-release-bundle:${SUPPLY_CHAIN_ARTIFACT}-${GITHUB_SHA}"
          case "$SUPPLY_CHAIN_ARTIFACT" in
            rgs-runtime) target=rgs-runtime ;;
            rgs-migrator) target=rgs-migrator ;;
            *) echo 'RGS build job received a non-RGS artifact' >&2; exit 2 ;;
          esac
          image_created=$(git show --no-patch --format=%cI "$GITHUB_SHA")
          docker buildx version > "$SUPPLY_CHAIN_REPORT_DIR/docker-buildx-version.txt"
          docker buildx build --builder "${{ steps.buildx.outputs.name }}" \
            --file deploy/cluster-production/Dockerfile.services \
            --target "$target" --platform linux/amd64 \
            --build-arg "OCI_IMAGE_CREATED=$image_created" \
            --build-arg "OCI_IMAGE_REVISION=$GITHUB_SHA" \
            --build-arg "OCI_IMAGE_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg "OCI_IMAGE_VERSION=$SUPPLY_CHAIN_IMAGE_TAG" \
            --tag "$local_ref" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "com.slots.release.source-tree=$SOURCE_TREE_SHA" \
            --provenance=false \
            --metadata-file "$SUPPLY_CHAIN_REPORT_DIR/bundle/build-metadata.json" \
            --output "type=oci,dest=$SUPPLY_CHAIN_REPORT_DIR/bundle/release-image.oci.tar" .

      - name: Scan the exact RGS OCI archive and generate dual-format image SBOM
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-release-rgs-cache
        run: |
          set -euo pipefail
          ./deploy/supply-chain/scan.sh oci-archive \
            "$SUPPLY_CHAIN_REPORT_DIR/bundle/release-image.oci.tar" release-image \
            "$SUPPLY_CHAIN_REPORT_DIR/image-scan"
          cp "$SUPPLY_CHAIN_REPORT_DIR/image-scan/release-image.cyclonedx.json" "$SUPPLY_CHAIN_REPORT_DIR/bundle/"
          cp "$SUPPLY_CHAIN_REPORT_DIR/image-scan/release-image.spdx.json" "$SUPPLY_CHAIN_REPORT_DIR/bundle/"
          cp "$SUPPLY_CHAIN_REPORT_DIR/image-scan/release-image.trivy.json" "$SUPPLY_CHAIN_REPORT_DIR/bundle/"
          cp ./deploy/supply-chain/tool-images.env "$SUPPLY_CHAIN_REPORT_DIR/bundle/tool-images.env"

      - name: Finalize source-tree-bound RGS bundle hashes
        id: finalize-rgs
        env:
          SUPPLY_CHAIN_APPROVAL_SHA256: none
          SUPPLY_CHAIN_APPROVAL_EXPIRES_AT: none
          SUPPLY_CHAIN_APPROVAL_METADATA_SHA256: none
        run: ./deploy/supply-chain/release-bundle.sh finalize "$SUPPLY_CHAIN_REPORT_DIR/bundle" rgs-unprivileged

      - name: Upload immutable RGS release bundle for the publish boundary
        id: upload-rgs-bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/bundle
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 7

      - name: Upload isolated RGS build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rgs-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/image-scan/**/*.json
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/image-scan/**/*.txt
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/image-scan/**/*.sha256
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/docker-buildx-version.txt
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  build-approved-web:
    needs: verify-source-conformance
    if: inputs.artifact == 'web-runtime' && needs.verify-source-conformance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 此独立环境只保存一次性 exact asset approval；没有 OIDC、Registry 凭据或 attestation 权限。
    environment: supply-chain-web-approval
    permissions:
      contents: read
    outputs:
      source_tree_sha: ${{ steps.context.outputs.source_tree_sha }}
      artifact_id: ${{ steps.upload-web-bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-web-bundle.outputs.artifact-digest }}
      bundle_manifest_sha256: ${{ steps.finalize-web.outputs.bundle_manifest_sha256 }}
      bundle_checksums_sha256: ${{ steps.finalize-web.outputs.bundle_checksums_sha256 }}
      oci_archive_sha256: ${{ steps.finalize-web.outputs.oci_archive_sha256 }}
      spdx_sha256: ${{ steps.finalize-web.outputs.spdx_sha256 }}
      configuration_sha256: ${{ steps.finalize-web.outputs.configuration_sha256 }}
      approval_expires_at: ${{ steps.finalize-web.outputs.approval_expires_at }}
      approval_metadata_sha256: ${{ steps.finalize-web.outputs.approval_metadata_sha256 }}
    defaults:
      run:
        working-directory: slots-game
    env:
      SUPPLY_CHAIN_REGISTRY: ${{ inputs.registry }}
      SUPPLY_CHAIN_IMAGE_REPOSITORY: ${{ inputs.image_repository }}
      SUPPLY_CHAIN_ARTIFACT: ${{ inputs.artifact }}
      SUPPLY_CHAIN_IMAGE_TAG: ${{ inputs.image_tag }}
      SUPPLY_CHAIN_EXPECTED_CERTIFICATE_IDENTITY: ${{ inputs.expected_certificate_identity }}
      SUPPLY_CHAIN_EXPECTED_OIDC_ISSUER: ${{ inputs.expected_oidc_issuer }}
      SUPPLY_CHAIN_REPORT_DIR: /tmp/slots-release-web-${{ github.run_id }}-${{ github.run_attempt }}
      RGS_BASE_URL: ${{ inputs.rgs_base_url }}
      RGS_BET_OPTIONS_MINOR: ${{ inputs.rgs_bet_options_minor }}
      RGS_DEFAULT_BET_MINOR: ${{ inputs.rgs_default_bet_minor }}
      RGS_HOST_ORIGIN: ${{ inputs.rgs_host_origin }}
      SKOPEO_IMAGE: quay.io/skopeo/stable:v1.21.0@sha256:a585e4a3b8a045baa87c7f1b2f940d6d299ebede85ab3f2419d52d2264eefc93

    steps:
      - name: Check out the exact source already verified upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Re-bind Web approval build to upstream source conformance
        id: context
        run: |
          set -euo pipefail
          test "${{ needs.verify-source-conformance.outputs.source_sha }}" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          source_tree_sha=$(git rev-parse "$GITHUB_SHA^{tree}")
          printf '%s\n' "$source_tree_sha" | grep -Eq '^[0-9a-f]{40}$'
          printf 'SOURCE_TREE_SHA=%s\n' "$source_tree_sha" >> "$GITHUB_ENV"
          printf 'source_tree_sha=%s\n' "$source_tree_sha" >> "$GITHUB_OUTPUT"
          ./deploy/supply-chain/release-sign.sh validate-build

      - name: Set up reviewed Buildx and digest-pinned BuildKit
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.34.1
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          buildkitd-flags: --debug=false
          install: true

      - name: Set up the reviewed Node.js runtime for exact Web byte verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Build exact approval-gated Web result as an OCI archive
        id: build-web
        env:
          WEB_RELEASE_ASSET_APPROVAL: ${{ secrets.SUPPLY_CHAIN_WEB_RELEASE_ASSET_APPROVAL }}
        run: |
          set -euo pipefail
          test -n "$WEB_RELEASE_ASSET_APPROVAL" || { echo 'SUPPLY_CHAIN_WEB_RELEASE_ASSET_APPROVAL is required' >&2; exit 2; }
          mkdir -p "$SUPPLY_CHAIN_REPORT_DIR/bundle"
          approval_file=$(mktemp "${RUNNER_TEMP}/release-asset-approval.XXXXXX")
          approval_metadata_file=$(mktemp "${RUNNER_TEMP}/release-asset-approval-metadata.XXXXXX")
          trap 'rm -f "$approval_file" "$approval_metadata_file"' EXIT HUP INT TERM
          chmod 0600 "$approval_file"
          printf '%s' "$WEB_RELEASE_ASSET_APPROVAL" > "$approval_file"
          approval_sha256=$(sha256sum "$approval_file" | awk '{ print $1 }')
          local_ref="slots-release-bundle:${SUPPLY_CHAIN_ARTIFACT}-${GITHUB_SHA}"
          docker buildx version > "$SUPPLY_CHAIN_REPORT_DIR/docker-buildx-version.txt"
          docker buildx build --builder "${{ steps.buildx.outputs.name }}" \
            --file deploy/web/Dockerfile --target runtime --platform linux/amd64 \
            --build-arg VITE_RGS_BASE_URL="$RGS_BASE_URL" \
            --build-arg VITE_RGS_BET_OPTIONS_MINOR="$RGS_BET_OPTIONS_MINOR" \
            --build-arg VITE_RGS_DEFAULT_BET_MINOR="$RGS_DEFAULT_BET_MINOR" \
            --build-arg VITE_RGS_HOST_ORIGIN="$RGS_HOST_ORIGIN" \
            --build-arg WEB_RELEASE_VERSION="$SUPPLY_CHAIN_IMAGE_TAG" \
            --build-arg WEB_RELEASE_REVISION="$GITHUB_SHA" \
            --secret "id=release_asset_approval,src=$approval_file" \
            --tag "$local_ref" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "com.slots.release.source-tree=$SOURCE_TREE_SHA" \
            --provenance=false \
            --metadata-file "$SUPPLY_CHAIN_REPORT_DIR/bundle/build-metadata.json" \
            --output "type=oci,dest=$SUPPLY_CHAIN_REPORT_DIR/bundle/release-image.oci.tar" .
          rm -f "$approval_metadata_file"
          ./deploy/supply-chain/release-bundle.sh approval-metadata "$approval_file" "$approval_metadata_file"
          approval_expires_at=$(sed -n 's/^ASSET_APPROVAL_EXPIRES_AT=//p' "$approval_metadata_file")
          approval_metadata_sha256=$(sed -n 's/^ASSET_APPROVAL_METADATA_SHA256=//p' "$approval_metadata_file")
          printf '%s\n' "$approval_metadata_sha256" | grep -Eq '^[0-9a-f]{64}$'
          rm -f "$approval_file" "$approval_metadata_file"
          trap - EXIT HUP INT TERM
          {
            printf 'approval_sha256=%s\n' "$approval_sha256"
            printf 'approval_expires_at=%s\n' "$approval_expires_at"
            printf 'approval_metadata_sha256=%s\n' "$approval_metadata_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke the exact approval-gated Web bytes in a real browser
        run: |
          set -euo pipefail
          local_ref="slots-release-browser-smoke:${GITHUB_SHA}"
          static_root=$(mktemp -d "${RUNNER_TEMP%/}/slots-release-web-root.XXXXXX")
          conversion_root=$(mktemp -d "${RUNNER_TEMP%/}/slots-release-web-conversion.XXXXXX")
          container_id=
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            docker image rm "$local_ref" >/dev/null 2>&1 || true
            case "$static_root" in
              "${RUNNER_TEMP%/}"/slots-release-web-root.*) rm -rf -- "$static_root" ;;
              *) echo '拒绝清理异常 Web 静态根目录' >&2 ;;
            esac
            case "$conversion_root" in
              "${RUNNER_TEMP%/}"/slots-release-web-conversion.*) rm -rf -- "$conversion_root" ;;
              *) echo '拒绝清理异常 Web 转换目录' >&2 ;;
            esac
          }
          trap cleanup EXIT HUP INT TERM
          docker pull "$SKOPEO_IMAGE"
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/skopeo-home \
            --env TMPDIR=/tmp \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --tmpfs /var/tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --volume "$SUPPLY_CHAIN_REPORT_DIR/bundle:/bundle:ro" \
            --volume "$conversion_root:/output" \
            "$SKOPEO_IMAGE" copy --all \
            oci-archive:/bundle/release-image.oci.tar \
            "docker-archive:/output/release-image.docker.tar:$local_ref"
          test -s "$conversion_root/release-image.docker.tar"
          docker load --input "$conversion_root/release-image.docker.tar" >/dev/null
          container_id=$(docker create "$local_ref")
          docker cp "$container_id:/usr/share/nginx/html/." "$static_root"
          docker rm "$container_id" >/dev/null
          container_id=
          VITE_RGS_BASE_URL="$RGS_BASE_URL" \
          VITE_RGS_BET_OPTIONS_MINOR="$RGS_BET_OPTIONS_MINOR" \
          VITE_RGS_DEFAULT_BET_MINOR="$RGS_DEFAULT_BET_MINOR" \
          VITE_RGS_HOST_ORIGIN="$RGS_HOST_ORIGIN" \
            node web/scripts/verify-production-browser-bootstrap.mjs \
              --distribution-root "$static_root"

      - name: Scan the exact approved Web OCI archive and generate dual-format SBOM
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-release-web-cache
        run: |
          set -euo pipefail
          ./deploy/supply-chain/scan.sh oci-archive \
            "$SUPPLY_CHAIN_REPORT_DIR/bundle/release-image.oci.tar" release-image \
            "$SUPPLY_CHAIN_REPORT_DIR/image-scan"
          cp "$SUPPLY_CHAIN_REPORT_DIR/image-scan/release-image.cyclonedx.json" "$SUPPLY_CHAIN_REPORT_DIR/bundle/"
          cp "$SUPPLY_CHAIN_REPORT_DIR/image-scan/release-image.spdx.json" "$SUPPLY_CHAIN_REPORT_DIR/bundle/"
          cp "$SUPPLY_CHAIN_REPORT_DIR/image-scan/release-image.trivy.json" "$SUPPLY_CHAIN_REPORT_DIR/bundle/"
          cp ./deploy/supply-chain/tool-images.env "$SUPPLY_CHAIN_REPORT_DIR/bundle/tool-images.env"

      - name: Finalize source-, config- and approval-bound Web bundle hashes
        id: finalize-web
        env:
          SUPPLY_CHAIN_APPROVAL_SHA256: ${{ steps.build-web.outputs.approval_sha256 }}
          SUPPLY_CHAIN_APPROVAL_EXPIRES_AT: ${{ steps.build-web.outputs.approval_expires_at }}
          SUPPLY_CHAIN_APPROVAL_METADATA_SHA256: ${{ steps.build-web.outputs.approval_metadata_sha256 }}
        run: ./deploy/supply-chain/release-bundle.sh finalize "$SUPPLY_CHAIN_REPORT_DIR/bundle" web-approved

      - name: Upload immutable approved Web release bundle
        id: upload-web-bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/bundle
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 7

      - name: Upload Web approval-build evidence without approval plaintext
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/image-scan/**/*.json
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/image-scan/**/*.txt
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/image-scan/**/*.sha256
            ${{ env.SUPPLY_CHAIN_REPORT_DIR }}/docker-buildx-version.txt
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  bind-release-artifact:
    needs:
      - verify-source-conformance
      - build-rgs
      - build-approved-web
    if: >-
      always() &&
      needs.verify-source-conformance.result == 'success' &&
      ((inputs.artifact == 'web-runtime' && needs.build-approved-web.result == 'success' && needs.build-rgs.result == 'skipped') ||
       (inputs.artifact != 'web-runtime' && needs.build-rgs.result == 'success' && needs.build-approved-web.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 独立、无 checkout 的 job 用 Actions API 把不可变 artifact ID 与服务端 archive digest、
    # 当前 run、commit 和唯一名称绑定；最终发布 job 不需要扩大到 actions:read。
    permissions:
      actions: read
    env:
      EXPECTED_ARTIFACT_ID: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.artifact_id || needs.build-rgs.outputs.artifact_id }}
      EXPECTED_ARTIFACT_DIGEST: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.artifact_digest || needs.build-rgs.outputs.artifact_digest }}
    steps:
      - name: Fail closed on stale or digest-mismatched release artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EXPECTED_ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s\n' "$EXPECTED_ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          metadata="$RUNNER_TEMP/release-artifact-metadata.json"
          curl --fail --location --show-error --silent --proto '=https' --tlsv1.2 \
            --retry 4 --retry-all-errors \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID" \
            --output "$metadata"
          jq -e --argjson artifact_id "$EXPECTED_ARTIFACT_ID" \
            --arg digest "sha256:$EXPECTED_ARTIFACT_DIGEST" \
            --arg name "release-bundle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg source_sha "$GITHUB_SHA" '
            .id == $artifact_id and .name == $name and .expired == false and
            .digest == $digest and .workflow_run.id == $run_id and
            .workflow_run.head_sha == $source_sha
          ' "$metadata" >/dev/null
          rm -f "$metadata"

  publish-sign:
    needs:
      - verify-source-conformance
      - build-rgs
      - build-approved-web
      - bind-release-artifact
    if: >-
      always() &&
      needs.verify-source-conformance.result == 'success' &&
      needs.bind-release-artifact.result == 'success' &&
      ((inputs.artifact == 'web-runtime' && needs.build-approved-web.result == 'success' && needs.build-rgs.result == 'skipped') ||
       (inputs.artifact != 'web-runtime' && needs.build-rgs.result == 'success' && needs.build-approved-web.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 只有这个最小 job 经过最终发布 Environment 审批并取得 OIDC/Registry 权限；它没有
    # checkout，也绝不执行 npm、Go、make、Docker build 或 scanner，只发布已校验的制品字节。
    environment: supply-chain-release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      SUPPLY_CHAIN_REGISTRY: ${{ inputs.registry }}
      SUPPLY_CHAIN_IMAGE_REPOSITORY: ${{ inputs.image_repository }}
      SUPPLY_CHAIN_ARTIFACT: ${{ inputs.artifact }}
      SUPPLY_CHAIN_IMAGE_TAG: ${{ inputs.image_tag }}
      SUPPLY_CHAIN_EXPECTED_CERTIFICATE_IDENTITY: ${{ inputs.expected_certificate_identity }}
      SUPPLY_CHAIN_EXPECTED_OIDC_ISSUER: ${{ inputs.expected_oidc_issuer }}
      BUNDLE_DOWNLOAD_DIR: /tmp/slots-release-publish-${{ github.run_id }}-${{ github.run_attempt }}/bundle
      PUBLISH_WORK_DIR: /tmp/slots-release-publish-${{ github.run_id }}-${{ github.run_attempt }}/work
      PUBLISH_EVIDENCE_DIR: /tmp/slots-release-publish-${{ github.run_id }}-${{ github.run_attempt }}/evidence
      RGS_BASE_URL: ${{ inputs.rgs_base_url }}
      RGS_BET_OPTIONS_MINOR: ${{ inputs.rgs_bet_options_minor }}
      RGS_DEFAULT_BET_MINOR: ${{ inputs.rgs_default_bet_minor }}
      RGS_HOST_ORIGIN: ${{ inputs.rgs_host_origin }}
      CONFIGURATION_SHA256: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.configuration_sha256 || needs.build-rgs.outputs.configuration_sha256 }}
      ASSET_APPROVAL_EXPIRES_AT: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.approval_expires_at || needs.build-rgs.outputs.approval_expires_at }}
      ASSET_APPROVAL_METADATA_SHA256: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.approval_metadata_sha256 || needs.build-rgs.outputs.approval_metadata_sha256 }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      AWS_ECR_RGS_RUNTIME_REPOSITORY: ${{ vars.AWS_ECR_RGS_RUNTIME_REPOSITORY }}
      AWS_ECR_RGS_MIGRATOR_REPOSITORY: ${{ vars.AWS_ECR_RGS_MIGRATOR_REPOSITORY }}
      AWS_ECR_WEB_REPOSITORY: ${{ vars.AWS_ECR_WEB_REPOSITORY }}
      COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
      SKOPEO_IMAGE: quay.io/skopeo/stable:v1.21.0@sha256:a585e4a3b8a045baa87c7f1b2f940d6d299ebede85ab3f2419d52d2264eefc93

    steps:
      - name: Download the exact upstream release artifact by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.artifact_id || needs.build-rgs.outputs.artifact_id }}
          path: ${{ env.BUNDLE_DOWNLOAD_DIR }}

      - name: Re-verify artifact channel, source identity, target, configuration and every byte
        env:
          EXPECTED_ARTIFACT_ID: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.artifact_id || needs.build-rgs.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.artifact_digest || needs.build-rgs.outputs.artifact_digest }}
          EXPECTED_SOURCE_TREE_SHA: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.source_tree_sha || needs.build-rgs.outputs.source_tree_sha }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.bundle_manifest_sha256 || needs.build-rgs.outputs.bundle_manifest_sha256 }}
          EXPECTED_CHECKSUMS_SHA256: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.bundle_checksums_sha256 || needs.build-rgs.outputs.bundle_checksums_sha256 }}
          EXPECTED_OCI_ARCHIVE_SHA256: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.oci_archive_sha256 || needs.build-rgs.outputs.oci_archive_sha256 }}
          EXPECTED_SPDX_SHA256: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.spdx_sha256 || needs.build-rgs.outputs.spdx_sha256 }}
          EXPECTED_CONFIGURATION_SHA256: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.configuration_sha256 || needs.build-rgs.outputs.configuration_sha256 }}
          EXPECTED_APPROVAL_EXPIRES_AT: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.approval_expires_at || needs.build-rgs.outputs.approval_expires_at }}
          EXPECTED_APPROVAL_METADATA_SHA256: ${{ inputs.artifact == 'web-runtime' && needs.build-approved-web.outputs.approval_metadata_sha256 || needs.build-rgs.outputs.approval_metadata_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_PROTECTED" = true
          case "$GITHUB_REF" in refs/tags/*) : ;; *) echo 'protected tag is required' >&2; exit 2 ;; esac
          printf '%s\n' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$SUPPLY_CHAIN_IMAGE_TAG" = "$GITHUB_REF_NAME"
          test "$SUPPLY_CHAIN_IMAGE_TAG" != latest
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/supply-chain-release.yml@$GITHUB_REF"
          test "$GITHUB_WORKFLOW_REF" = "$expected_workflow_ref"
          test "$SUPPLY_CHAIN_EXPECTED_CERTIFICATE_IDENTITY" = "$GITHUB_SERVER_URL/$expected_workflow_ref"
          test "$SUPPLY_CHAIN_EXPECTED_OIDC_ISSUER" = https://token.actions.githubusercontent.com
          printf '%s\n' "$AWS_ACCOUNT_ID" | grep -Eq '^[0-9]{12}$'
          printf '%s\n' "$AWS_REGION" | grep -Eq '^[a-z]{2}(-[a-z]+)+-[0-9]+$'
          expected_registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          test "$SUPPLY_CHAIN_REGISTRY" = "$expected_registry"
          case "$SUPPLY_CHAIN_ARTIFACT" in
            rgs-runtime) expected_ecr_repository=$AWS_ECR_RGS_RUNTIME_REPOSITORY ;;
            rgs-migrator) expected_ecr_repository=$AWS_ECR_RGS_MIGRATOR_REPOSITORY ;;
            web-runtime) expected_ecr_repository=$AWS_ECR_WEB_REPOSITORY ;;
            *) exit 2 ;;
          esac
          printf '%s\n' "$expected_ecr_repository" | \
            grep -Eq '^[a-z0-9]+([._/-][a-z0-9]+)*$'
          test "$SUPPLY_CHAIN_IMAGE_REPOSITORY" = "$expected_registry/$expected_ecr_repository"
          printf '%s\n' "$AWS_RELEASE_ROLE_ARN" | \
            grep -Eq "^arn:aws:iam::${AWS_ACCOUNT_ID}:role/[A-Za-z0-9+=,.@_/-]+$"

          printf '%s\n' "$EXPECTED_ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s\n' "$EXPECTED_ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s\n' "$EXPECTED_SOURCE_TREE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$EXPECTED_MANIFEST_SHA256" "$EXPECTED_CHECKSUMS_SHA256" \
            "$EXPECTED_OCI_ARCHIVE_SHA256" "$EXPECTED_SPDX_SHA256" \
            "$EXPECTED_CONFIGURATION_SHA256" | \
            grep -Ec '^[0-9a-f]{64}$' | grep -Eq '^5$'
          test "$(find "$BUNDLE_DOWNLOAD_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 8
          test -z "$(find "$BUNDLE_DOWNLOAD_DIR" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test "$(sha256sum "$BUNDLE_DOWNLOAD_DIR/bundle-manifest.env" | awk '{ print $1 }')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum "$BUNDLE_DOWNLOAD_DIR/bundle-checksums.sha256" | awk '{ print $1 }')" = "$EXPECTED_CHECKSUMS_SHA256"
          test "$(sha256sum "$BUNDLE_DOWNLOAD_DIR/release-image.oci.tar" | awk '{ print $1 }')" = "$EXPECTED_OCI_ARCHIVE_SHA256"
          test "$(sha256sum "$BUNDLE_DOWNLOAD_DIR/release-image.spdx.json" | awk '{ print $1 }')" = "$EXPECTED_SPDX_SHA256"
          test "$(wc -l < "$BUNDLE_DOWNLOAD_DIR/bundle-manifest.env" | tr -d ' ')" = 19

          configuration_sha256=$(printf 'RGS_BASE_URL=%s\nRGS_BET_OPTIONS_MINOR=%s\nRGS_DEFAULT_BET_MINOR=%s\nRGS_HOST_ORIGIN=%s\n' \
            "$RGS_BASE_URL" "$RGS_BET_OPTIONS_MINOR" "$RGS_DEFAULT_BET_MINOR" "$RGS_HOST_ORIGIN" | \
            sha256sum | awk '{ print $1 }')
          if [ "$SUPPLY_CHAIN_ARTIFACT" = web-runtime ]; then
            expected_build_kind=web-approved
            grep -Eq '^ASSET_APPROVAL_SHA256=[0-9a-f]{64}$' "$BUNDLE_DOWNLOAD_DIR/bundle-manifest.env"
            printf '%s\n' "$EXPECTED_APPROVAL_METADATA_SHA256" | grep -Eq '^[0-9a-f]{64}$'
            test "$EXPECTED_APPROVAL_EXPIRES_AT" = "$ASSET_APPROVAL_EXPIRES_AT"
            test "$EXPECTED_APPROVAL_METADATA_SHA256" = "$ASSET_APPROVAL_METADATA_SHA256"
          else
            expected_build_kind=rgs-unprivileged
            test -z "$RGS_BASE_URL$RGS_BET_OPTIONS_MINOR$RGS_DEFAULT_BET_MINOR$RGS_HOST_ORIGIN"
            grep -F -x 'ASSET_APPROVAL_SHA256=none' "$BUNDLE_DOWNLOAD_DIR/bundle-manifest.env"
            test "$EXPECTED_APPROVAL_EXPIRES_AT" = none
            test "$EXPECTED_APPROVAL_METADATA_SHA256" = none
          fi
          local_ref="slots-release-bundle:${SUPPLY_CHAIN_ARTIFACT}-${GITHUB_SHA}"
          for expected_line in \
            'BUNDLE_SCHEMA_VERSION=2' \
            "SOURCE_SHA=$GITHUB_SHA" \
            "SOURCE_TREE_SHA=$EXPECTED_SOURCE_TREE_SHA" \
            "SOURCE_REF=$GITHUB_REF" \
            "SOURCE_WORKFLOW_REF=$GITHUB_WORKFLOW_REF" \
            "ARTIFACT=$SUPPLY_CHAIN_ARTIFACT" \
            "IMAGE_REPOSITORY=$SUPPLY_CHAIN_IMAGE_REPOSITORY" \
            "IMAGE_TAG=$SUPPLY_CHAIN_IMAGE_TAG" \
            'TARGET_PLATFORM=linux/amd64' \
            "BUILD_KIND=$expected_build_kind" \
            "LOCAL_IMAGE_REF=$local_ref" \
            "CONFIGURATION_SHA256=$EXPECTED_CONFIGURATION_SHA256" \
            "ASSET_APPROVAL_EXPIRES_AT=$EXPECTED_APPROVAL_EXPIRES_AT" \
            "ASSET_APPROVAL_METADATA_SHA256=$EXPECTED_APPROVAL_METADATA_SHA256" \
            "OCI_ARCHIVE_SHA256=$EXPECTED_OCI_ARCHIVE_SHA256" \
            "SPDX_SHA256=$EXPECTED_SPDX_SHA256" \
            "CHECKSUMS_SHA256=$EXPECTED_CHECKSUMS_SHA256"
          do
            grep -F -x -- "$expected_line" "$BUNDLE_DOWNLOAD_DIR/bundle-manifest.env" >/dev/null
          done
          test "$configuration_sha256" = "$EXPECTED_CONFIGURATION_SHA256"

          if ! awk 'NF != 2 || $1 !~ /^[0-9a-f]{64}$/ || $2 !~ /^\*?(build-metadata\.json|release-image\.(cyclonedx\.json|oci\.tar|spdx\.json|trivy\.json)|tool-images\.env)$/ { bad = 1 } END { exit bad || NR != 6 }' \
            "$BUNDLE_DOWNLOAD_DIR/bundle-checksums.sha256"; then
            echo 'bundle checksum allowlist is invalid' >&2
            exit 2
          fi
          (cd "$BUNDLE_DOWNLOAD_DIR" && sha256sum --check --strict bundle-checksums.sha256)
          if tar -tf "$BUNDLE_DOWNLOAD_DIR/release-image.oci.tar" | grep -E '(^/|(^|/)\.\.(/|$))' >/dev/null; then
            echo 'OCI archive contains an unsafe path' >&2
            exit 2
          fi
          tar -xOf "$BUNDLE_DOWNLOAD_DIR/release-image.oci.tar" oci-layout | \
            grep -Eq '"imageLayoutVersion"[[:space:]]*:[[:space:]]*"1\.0\.0"'
          oci_manifest_digest=$(tar -xOf "$BUNDLE_DOWNLOAD_DIR/release-image.oci.tar" index.json | \
            jq -er 'select(.schemaVersion == 2) | .manifests | select(length == 1) | .[0].digest')
          test "$(jq -er '.\"containerimage.digest\"' "$BUNDLE_DOWNLOAD_DIR/build-metadata.json")" = "$oci_manifest_digest"
          grep -F -x "OCI_MANIFEST_DIGEST=$oci_manifest_digest" "$BUNDLE_DOWNLOAD_DIR/bundle-manifest.env" >/dev/null
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6"' "$BUNDLE_DOWNLOAD_DIR/release-image.cyclonedx.json" >/dev/null
          jq -e '.spdxVersion == "SPDX-2.3"' "$BUNDLE_DOWNLOAD_DIR/release-image.spdx.json" >/dev/null
          if grep -Eq '"(Code|Match)"[[:space:]]*:' "$BUNDLE_DOWNLOAD_DIR/release-image.trivy.json"; then
            echo 'Trivy evidence contains forbidden secret plaintext fields' >&2
            exit 2
          fi
          # 纯 OCI layout 已完成离线复核；使用断网、固定 digest 的 Skopeo 只做格式转换，
          # 生成 Docker 明确定义可 load 的归档。转换容器拿不到 OIDC、Registry 或 Docker socket。
          install -d -m 0700 "$PUBLISH_WORK_DIR" "$PUBLISH_EVIDENCE_DIR"
          docker run --rm --user "$(id -u):$(id -g)" --read-only --network=none \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --env HOME=/tmp/skopeo-home \
            --mount "type=bind,src=$BUNDLE_DOWNLOAD_DIR,dst=/input,readonly" \
            --mount "type=bind,src=$PUBLISH_WORK_DIR,dst=/out" \
            "$SKOPEO_IMAGE" copy \
              oci-archive:/input/release-image.oci.tar \
              "docker-archive:/out/release-image.docker.tar:$local_ref"
          test -s "$PUBLISH_WORK_DIR/release-image.docker.tar"
          docker_archive_sha256=$(sha256sum "$PUBLISH_WORK_DIR/release-image.docker.tar" | awk '{ print $1 }')
          printf '%s  release-image.docker.tar\n' "$docker_archive_sha256" > \
            "$PUBLISH_EVIDENCE_DIR/release-image.docker.tar.sha256"

      - name: Assume the release-only AWS role after offline bundle verification
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: slots-release-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify AWS account and fail-closed ECR repository controls
        run: |
          set -euo pipefail
          actual_account=$(aws sts get-caller-identity --query Account --output text)
          test "$actual_account" = "$AWS_ACCOUNT_ID"
          case "$SUPPLY_CHAIN_ARTIFACT" in
            rgs-runtime) repository_name=$AWS_ECR_RGS_RUNTIME_REPOSITORY ;;
            rgs-migrator) repository_name=$AWS_ECR_RGS_MIGRATOR_REPOSITORY ;;
            web-runtime) repository_name=$AWS_ECR_WEB_REPOSITORY ;;
            *) exit 2 ;;
          esac
          repository_json=$(aws ecr describe-repositories \
            --repository-names "$repository_name" \
            --query 'repositories[0]' --output json)
          jq -e --arg uri "$SUPPLY_CHAIN_IMAGE_REPOSITORY" '
            .repositoryUri == $uri and
            .imageTagMutability == "IMMUTABLE" and
            .encryptionConfiguration.encryptionType == "KMS"
          ' <<<"$repository_json" >/dev/null
          scanning_json=$(aws ecr get-registry-scanning-configuration --output json)
          jq -e --arg repository "$repository_name" '
            .scanningConfiguration as $configuration |
            $configuration.scanType == "ENHANCED" and
            (
              (($configuration.rules // []) | length) == 0 or
              any($configuration.rules[]?;
                .scanFrequency == "CONTINUOUS_SCAN" and
                any(.repositoryFilters[]?;
                  .filterType == "WILDCARD" and
                  (.filter == "*" or .filter == $repository)
                )
              )
            )
          ' <<<"$scanning_json" >/dev/null

      - name: Fail closed unless the immutable final release tag is absent
        run: |
          set -euo pipefail
          case "$SUPPLY_CHAIN_ARTIFACT" in
            rgs-runtime) repository_name=$AWS_ECR_RGS_RUNTIME_REPOSITORY ;;
            rgs-migrator) repository_name=$AWS_ECR_RGS_MIGRATOR_REPOSITORY ;;
            web-runtime) repository_name=$AWS_ECR_WEB_REPOSITORY ;;
            *) exit 2 ;;
          esac
          final_tag_probe="$RUNNER_TEMP/final-tag-preflight.json"
          final_tag_error="$RUNNER_TEMP/final-tag-preflight.stderr"
          if aws ecr describe-images --repository-name "$repository_name" --image-ids "imageTag=$SUPPLY_CHAIN_IMAGE_TAG" --output json >"$final_tag_probe" 2>"$final_tag_error"; then
            jq -e --arg tag "$SUPPLY_CHAIN_IMAGE_TAG" '
              .imageDetails | type == "array" and length == 1 and
              (.[0].imageTags | type == "array" and index($tag) != null) and
              (.[0].imageDigest | test("^sha256:[0-9a-f]{64}$"))
            ' "$final_tag_probe" >/dev/null
            echo 'final release tag already exists; refusing candidate publication' >&2
            exit 1
          fi
          if ! grep -F 'ImageNotFoundException' "$final_tag_error" >/dev/null; then
            echo 'unable to prove that the final release tag is absent' >&2
            exit 1
          fi
          rm -f "$final_tag_probe" "$final_tag_error"

      - name: Log in to the approved ECR registry with temporary credentials
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}
          mask-password: true

      - name: Load exact OCI archive, push candidate and resolve Registry digest
        id: publish
        run: |
          set -euo pipefail
          require_current_web_approval() {
            if [ "$SUPPLY_CHAIN_ARTIFACT" != web-runtime ]; then
              return 0
            fi
            if ! ASSET_APPROVAL_EXPIRES_AT="$ASSET_APPROVAL_EXPIRES_AT" node -e '
              const value = process.env.ASSET_APPROVAL_EXPIRES_AT ?? "";
              const timestamp = Date.parse(value);
              const canonical = Number.isFinite(timestamp)
                ? new Date(timestamp).toISOString().replace(".000Z", "Z")
                : "";
              if (value !== canonical || timestamp <= Date.now()) process.exit(1);
            '; then
              echo 'approval has expired immediately before Registry push' >&2
              exit 2
            fi
          }
          install -d -m 0700 "$PUBLISH_EVIDENCE_DIR"
          local_ref="slots-release-bundle:${SUPPLY_CHAIN_ARTIFACT}-${GITHUB_SHA}"
          candidate_ref="$SUPPLY_CHAIN_IMAGE_REPOSITORY:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker load --input "$PUBLISH_WORK_DIR/release-image.docker.tar"
          docker image inspect "$local_ref" >/dev/null
          docker tag "$local_ref" "$candidate_ref"
          require_current_web_approval
          docker push "$candidate_ref"
          digest=''
          for repo_digest in $(docker image inspect --format '{{join .RepoDigests " "}}' "$candidate_ref"); do
            case "$repo_digest" in "$SUPPLY_CHAIN_IMAGE_REPOSITORY"@sha256:*) digest=${repo_digest#*@} ;; esac
          done
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          docker pull "$SUPPLY_CHAIN_IMAGE_REPOSITORY@$digest"
          printf '%s\n' "$SUPPLY_CHAIN_IMAGE_REPOSITORY@$digest" > "$PUBLISH_EVIDENCE_DIR/release-image-digest.txt"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image_repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attach exact SPDX SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image_repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: ${{ env.BUNDLE_DOWNLOAD_DIR }}/release-image.spdx.json
          push-to-registry: true

      - name: Sign by GitHub OIDC and verify the exact certificate identity
        env:
          SUPPLY_CHAIN_IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image_reference="$SUPPLY_CHAIN_IMAGE_REPOSITORY@$SUPPLY_CHAIN_IMAGE_DIGEST"
          docker_config=${DOCKER_CONFIG:-"$HOME/.docker"}
          test -s "$docker_config/config.json"
          docker run --rm --user "$(id -u):$(id -g)" --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --env HOME=/tmp/cosign-home --env DOCKER_CONFIG=/cosign-auth \
            --env ACTIONS_ID_TOKEN_REQUEST_URL --env ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            --mount "type=bind,src=$docker_config,dst=/cosign-auth,readonly" \
            "$COSIGN_IMAGE" sign --yes "$image_reference"
          docker run --rm --user "$(id -u):$(id -g)" --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --env HOME=/tmp/cosign-home --env DOCKER_CONFIG=/cosign-auth \
            --mount "type=bind,src=$docker_config,dst=/cosign-auth,readonly" \
            "$COSIGN_IMAGE" verify \
              --certificate-identity "$SUPPLY_CHAIN_EXPECTED_CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$SUPPLY_CHAIN_EXPECTED_OIDC_ISSUER" \
              --output json "$image_reference" > "$PUBLISH_EVIDENCE_DIR/cosign-verify.json"
          test -s "$PUBLISH_EVIDENCE_DIR/cosign-verify.json"

      - name: Collect signed attestation bundles
        run: |
          set -euo pipefail
          path_list="$RUNNER_TEMP/created_attestation_paths.txt"
          test -s "$path_list"
          mkdir -p "$PUBLISH_EVIDENCE_DIR/attestations"
          count=0
          while IFS= read -r attestation_path; do
            case "$attestation_path" in "$RUNNER_TEMP"/*) : ;; *) exit 2 ;; esac
            test -s "$attestation_path"
            count=$((count + 1))
            cp "$attestation_path" "$PUBLISH_EVIDENCE_DIR/attestations/attestation-$count.sigstore.json"
          done < "$path_list"
          test "$count" -ge 2

      - name: Promote the verified digest to the immutable final release tag
        env:
          SUPPLY_CHAIN_IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          require_current_web_approval() {
            if [ "$SUPPLY_CHAIN_ARTIFACT" != web-runtime ]; then
              return 0
            fi
            if ! ASSET_APPROVAL_EXPIRES_AT="$ASSET_APPROVAL_EXPIRES_AT" node -e '
              const value = process.env.ASSET_APPROVAL_EXPIRES_AT ?? "";
              const timestamp = Date.parse(value);
              const canonical = Number.isFinite(timestamp)
                ? new Date(timestamp).toISOString().replace(".000Z", "Z")
                : "";
              if (value !== canonical || timestamp <= Date.now()) process.exit(1);
            '; then
              echo 'approval has expired immediately before Registry push' >&2
              exit 2
            fi
          }
          local_ref="slots-release-bundle:${SUPPLY_CHAIN_ARTIFACT}-${GITHUB_SHA}"
          final_ref="$SUPPLY_CHAIN_IMAGE_REPOSITORY:$SUPPLY_CHAIN_IMAGE_TAG"
          if docker manifest inspect "$final_ref" >/dev/null 2>&1; then
            echo 'final release tag already exists; Registry tags must be immutable' >&2
            exit 1
          fi
          docker tag "$local_ref" "$final_ref"
          require_current_web_approval
          docker push "$final_ref"
          docker pull "$final_ref"
          docker image inspect --format '{{join .RepoDigests "\n"}}' "$final_ref" | \
            grep -F -x "$SUPPLY_CHAIN_IMAGE_REPOSITORY@$SUPPLY_CHAIN_IMAGE_DIGEST"

      - name: Remove transient release bytes before audit evidence upload
        if: always()
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker logout "$registry" >/dev/null 2>&1 || true
          rm -rf "$PUBLISH_WORK_DIR" "$BUNDLE_DOWNLOAD_DIR"

      - name: Upload privileged publish/sign evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PUBLISH_EVIDENCE_DIR }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
