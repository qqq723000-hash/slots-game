# Helm 在安装或升级业务 Deployment 前运行数据库迁移；失败会中止发布并保留现场。
# English: Helm runs database migrations before installing or upgrading a business deployment; failure aborts
# the deployment and preserves the site.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slots.resourceName" (dict "root" . "suffix" "migrator-default-deny") }}
  labels:
    {{- include "slots.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "slots.selectorLabels" (dict "root" . "component" "migrator") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slots.resourceName" (dict "root" . "suffix" "migrator-egress") }}
  labels:
    {{- include "slots.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "slots.selectorLabels" (dict "root" . "component" "migrator") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        {{- range .Values.networkPolicy.egress.database.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.egress.database.port }}
          protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "slots.resourceName" (dict "root" . "suffix" "migrator") }}
  labels:
    {{- include "slots.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    slots-game.io/release-compatibility-class: {{ .Values.release.compatibilityClass | quote }}
spec:
  backoffLimit: {{ .Values.migrator.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrator.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "slots.selectorLabels" (dict "root" . "component" "migrator") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrator
          image: {{ include "slots.image" .Values.images.migrator | quote }}
          imagePullPolicy: {{ .Values.images.migrator.pullPolicy }}
          args:
            {{- if .Release.IsInstall }}
            - up
            {{- else }}
            - verify
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: RGS_MIGRATOR_DATABASE_URL_FILE
              value: {{ printf "/run/rgs/database/%s" .Values.externalSecrets.migratorDatabase.urlKey | quote }}
            - name: RGS_RUNTIME_DATABASE_ROLE
              value: rgs_runtime
            - name: RGS_MIGRATION_TIMEOUT
              value: {{ printf "%ds" (int .Values.migrator.migrationTimeoutSeconds) | quote }}
          resources:
            {{- toYaml .Values.migrator.resources | nindent 12 }}
          volumeMounts:
            - name: migrator-database
              mountPath: /run/rgs/database
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: migrator-database
          secret:
            secretName: {{ .Values.externalSecrets.migratorDatabase.name }}
            defaultMode: 0440
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
# 发布成功后用同名 post hook 原子替换并删除 pre hook 网络策略；失败时保留策略和 Job 供排障。
# English: After the release is successful, atomically replace and delete the pre hook network policy with the
# post hook with the same name; if it fails, the policy and job will be retained for troubleshooting.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slots.resourceName" (dict "root" . "suffix" "migrator-default-deny") }}
  labels:
    {{- include "slots.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: migrator-cleanup
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      {{- include "slots.selectorLabels" (dict "root" . "component" "migrator") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slots.resourceName" (dict "root" . "suffix" "migrator-egress") }}
  labels:
    {{- include "slots.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: migrator-cleanup
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      {{- include "slots.selectorLabels" (dict "root" . "component" "migrator") | nindent 6 }}
  policyTypes:
    - Egress
  egress: []
