apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "slots.resourceName" (dict "root" . "suffix" "rgs-alerts") }}
  labels:
    {{- include "slots.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
    {{- with .Values.monitoring.ruleLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: slots-rgs.rules
      rules:
        - alert: SlotsRGSTargetUnavailable
          expr: |
            min(up{job="slots-rgs",namespace="{{ .Release.Namespace }}"}) < 1
            or absent(up{job="slots-rgs",namespace="{{ .Release.Namespace }}"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: RGS 指标目标不可用
            description: 至少一个 RGS operations 指标目标连续两分钟不可抓取，或全部目标已从服务发现消失。
        - alert: SlotsRGSNotReady
          expr: |
            min(rgs_ready{job="slots-rgs",namespace="{{ .Release.Namespace }}"}) < 1
            or absent(rgs_ready{job="slots-rgs",namespace="{{ .Release.Namespace }}"})
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: RGS 副本持续未就绪
            description: 至少一个可抓取 RGS API 副本的数据库、密钥或生命周期就绪检查持续失败。
        - alert: SlotsRGSWorkerTargetUnavailable
          expr: |
            min(up{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"}) < 1
            or absent(up{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: RGS Worker 指标目标不可用
            description: 至少一个 Worker operations 指标目标连续两分钟不可抓取，或全部目标已从服务发现消失。
        - alert: SlotsRGSWorkerNotReady
          expr: |
            min(rgs_ready{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"}) < 1
            or absent(rgs_ready{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"})
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: RGS Worker 持续未就绪
            description: 至少一个 Worker 的数据库、密钥或审计 outbox 循环及 backlog 新鲜度检查持续失败；钱包恢复循环由独立新鲜度告警覆盖。
        - alert: SlotsRGSServerErrorRateHigh
          expr: |
            (
              sum(rate(rgs_http_server_failures_total{job="slots-rgs",namespace="{{ .Release.Namespace }}"}[5m]))
              /
              clamp_min(sum(rate(rgs_http_requests_total{job="slots-rgs",namespace="{{ .Release.Namespace }}"}[5m])), 0.001)
            ) > 0.05
            and sum(rate(rgs_http_requests_total{job="slots-rgs",namespace="{{ .Release.Namespace }}"}[5m])) > 0.1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: RGS 服务端错误率过高
            description: 过去五分钟的 5xx 比例持续超过百分之五，且请求量已超过最低噪声门槛。
        - alert: SlotsRGSCapacityRejected
          expr: |
            sum(increase(rgs_capacity_rejected_total{job="slots-rgs",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: RGS 进程并发闸门持续拒绝请求
            description: RGS 已因进程级并发容量上限拒绝公网请求；应核对 HPA、Pod 资源和上游全局限流。
        - alert: SlotsRGSNewIntentCapacityRejected
          expr: |
            sum(increase(rgs_new_intent_capacity_rejected_total{job="slots-rgs",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          labels:
            severity: warning
          annotations:
            summary: RGS 新经济意图因数据库保留容量被拒绝
            description: 新 launch 或 spin 已为保护状态查询、待交付结果和确认路径而返回容量错误；应核对数据库池、HPA 和入口流量，且只能在 PostgreSQL 总连接预算允许时扩容。
        - alert: SlotsRGSCryptographicCapacityRejected
          expr: |
            sum(increase(rgs_cryptographic_capacity_rejected_total{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: RGS 加密 CPU 闸门持续拒绝请求
            description: Ed25519 验签、令牌验证或响应签名已耗尽有界 CPU 许可；应核对边缘攻击、预认证流量、Pod CPU/HPA 和加密并发预算，禁止通过无界 goroutine 规避。
        - alert: SlotsRGSHPAUnableToScale
          expr: |
            count(max by (horizontalpodautoscaler) (kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="{{ .Release.Namespace }}",condition="ScalingActive",status="true",horizontalpodautoscaler=~"{{ include "slots.resourceName" (dict "root" . "suffix" "rgs") }}|{{ include "slots.resourceName" (dict "root" . "suffix" "rgs-worker") }}"} == 1)) < 2
            or absent(kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="{{ .Release.Namespace }}",condition="ScalingActive",status="true",horizontalpodautoscaler=~"{{ include "slots.resourceName" (dict "root" . "suffix" "rgs") }}|{{ include "slots.resourceName" (dict "root" . "suffix" "rgs-worker") }}"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: RGS HPA 无法计算扩缩容目标
            description: API 或 Worker HPA 的 ScalingActive 未保持为真；应检查 metrics-server、聚合 API、kube-state-metrics 与资源指标，避免流量高峰停留在暖副本下限。
        - alert: SlotsRGSSharedAdmissionErrors
          expr: |
            sum(increase(rgs_shared_admission_errors_total{job="slots-rgs",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: RGS 共享准入后端持续故障
            description: Valkey 准入错误持续发生；新启动和 Spin 会失败关闭，但已提交结果恢复路径仍保持就绪，应立即检查 TLS、ACL、NetworkPolicy 和集群健康。
        - alert: SlotsRGSEconomicAdmissionLimitedSustained
          expr: |
            (
              sum(rate(rgs_economic_admission_limited_total{job="slots-rgs",namespace="{{ .Release.Namespace }}"}[5m]))
              /
              clamp_min(
                sum(rate(rgs_economic_admission_allowed_total{job="slots-rgs",namespace="{{ .Release.Namespace }}"}[5m]))
                + sum(rate(rgs_economic_admission_limited_total{job="slots-rgs",namespace="{{ .Release.Namespace }}"}[5m])),
                0.001
              )
            ) > 0.05
            and sum(rate(rgs_economic_admission_limited_total{job="slots-rgs",namespace="{{ .Release.Namespace }}"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: RGS 钱包成本预算持续拒绝新 Spin
            description: 已验证 Spin 意图的 operator/backend 原子成本桶拒绝比例持续超过百分之五；应核对 EDoS 攻击、运营商异常重试和钱包合同容量，禁止牺牲状态查询或恢复通道。
        - alert: SlotsRGSEconomicAdmissionErrors
          expr: |
            sum(increase(rgs_economic_admission_errors_total{job="slots-rgs",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: RGS 钱包成本准入持续故障
            description: Valkey 双桶脚本、静态 operator/backend 路由或返回协议持续失败；新 Spin 已失败关闭，status/result/ACK 与 Worker 恢复必须继续可用。
        - alert: SlotsRGSEconomicAdmissionUnavailable
          expr: |
            (
              rgs_economic_admission_ready{job="slots-rgs",namespace="{{ .Release.Namespace }}"} == 0
              and on (job, namespace, instance)
              rgs_ready{job="slots-rgs",namespace="{{ .Release.Namespace }}"} == 1
            )
            or
            (
              rgs_ready{job="slots-rgs",namespace="{{ .Release.Namespace }}"} == 1
              unless on (job, namespace, instance)
              rgs_economic_admission_ready{job="slots-rgs",namespace="{{ .Release.Namespace }}"}
            )
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: RGS API 仍就绪但经济准入不可用
            description: 基础状态、结果恢复和确认 API 仍可用，但 shared PING/基础脚本与经济 Lua 的组合健康连续失败或指标缺失；停止新经济意图并检查 Valkey TLS、ACL、Lua 与网络。
        - alert: SlotsRGSEconomicAdmissionObservationStale
          expr: |
            (
              (
                rgs_economic_admission_last_success_age_seconds{job="slots-rgs",namespace="{{ .Release.Namespace }}"} < 0
                or rgs_economic_admission_last_success_age_seconds{job="slots-rgs",namespace="{{ .Release.Namespace }}"} > 900
              )
              and on (job, namespace, instance)
              rgs_ready{job="slots-rgs",namespace="{{ .Release.Namespace }}"} == 1
            )
            or
            (
              rgs_ready{job="slots-rgs",namespace="{{ .Release.Namespace }}"} == 1
              unless on (job, namespace, instance)
              rgs_economic_admission_last_success_age_seconds{job="slots-rgs",namespace="{{ .Release.Namespace }}"}
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: RGS 经济准入成功证据陈旧
            description: API 仍就绪，但 shared 与 economic 两条路径中至少一条超过十五分钟没有成功观测，或年龄指标缺失；核查真实流量、PING/Lua canary 接线与 Valkey 可用性。
        - alert: SlotsRGSAuthReplay
          expr: |
            sum(increase(rgs_auth_replays_total{job="slots-rgs",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          labels:
            severity: warning
          annotations:
            summary: RGS 检测到认证随机数重放
            description: 已验证签名的运营商请求重复使用随机数并被拒绝；应检查调用方重试实现、凭据泄漏风险及相关安全日志。
        - alert: SlotsRGSSecurityLogDropsSustained
          expr: |
            sum(increase(rgs_security_logs_dropped_total{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: RGS 重复安全 WARN 持续被有界抑制
            description: 权威安全事件计数仍完整，但固定物理 WARN 写入预算连续耗尽；应关联认证重放、边缘防护和认证失败判断攻击或错误重试，禁止用阻塞请求线程换取完整重复日志。
        - alert: SlotsRGSTraceExportFailures
          expr: |
            sum(increase(rgs_trace_export_failures_total{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          labels:
            severity: warning
          annotations:
            summary: RGS 分布式追踪导出失败
            description: API 或 Worker 的 OTLP exporter 在有界重试后仍失败；资金请求保持失败开放，应检查 collector TLS、NetworkPolicy、容量和接收状态。
        - alert: SlotsRGSWalletUnknownOutcome
          expr: |
            sum(increase(rgs_wallet_unknown_outcomes_total{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          labels:
            severity: critical
          annotations:
            summary: 钱包调用出现未知结果
            description: 钱包操作需要状态对账；必须确认恢复任务、钱包幂等查询和资金结果最终一致。
        - alert: SlotsRGSWalletIsolationRejected
          expr: |
            sum(increase(rgs_wallet_isolation_rejected_total{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          labels:
            severity: warning
          annotations:
            summary: 钱包隔离闸门拒绝请求
            description: 钱包调用被后端容量、运营商容量或熔断器非阻塞拒绝；应检查外部钱包延迟、单租户流量和隔离预算。
        - alert: SlotsRGSWalletCircuitOpen
          expr: |
            max(rgs_wallet_breakers{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}",state="open"}) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: 钱包熔断器持续打开
            description: 至少一个 Apply 或 Lookup 钱包熔断器持续打开；恢复查询容量仍保持独立，Pod 就绪状态不会掩盖该依赖故障。
        - alert: SlotsRGSWalletPendingSustained
          expr: |
            sum(rate(rgs_wallet_request_duration_seconds_count{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}",outcome="pending"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 钱包待定结果持续出现
            description: 钱包持续返回待定结果；应核对恢复吞吐、Lookup 延迟和积压，禁止盲目重提经济指令。
        - alert: SlotsRGSWalletResponseAuthenticationInvalid
          expr: |
            sum(increase(rgs_wallet_request_duration_seconds_count{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}",outcome="response_auth_invalid"}[5m])) > 0
          labels:
            severity: critical
          annotations:
            summary: 钱包响应认证失败
            description: 钱包响应签名或绑定认证失败；必须检查运营商密钥、路由绑定和响应完整性，禁止把未认证正文解释为资金结果。
        - alert: SlotsRGSWalletLatencyHigh
          expr: |
            histogram_quantile(
              0.99,
              sum by (le, method) (
                rate(rgs_wallet_request_duration_seconds_bucket{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m])
              )
            ) > 2
            and on (method)
            sum by (method) (
              rate(rgs_wallet_request_duration_seconds_count{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m])
            ) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 钱包调用 P99 时延持续过高
            description: 固定方法维度的钱包调用 P99 持续超过两秒且存在有效流量；应检查外部钱包、网络、熔断和恢复 Lookup 容量。
        - alert: SlotsRGSWalletRequestsStalled
          expr: |
            max by (method) (
              max_over_time(rgs_wallet_inflight{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m])
            ) > 0
            and on (method)
            sum by (method) (
              increase(rgs_wallet_request_duration_seconds_count{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m])
            ) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 钱包调用持续占用但没有完成
            description: 固定方法维度存在执行中钱包调用，但五分钟没有任何完成样本；应检查不响应的外部连接、硬截止与隔离槽位。
        - alert: SlotsRGSRecoveryBacklogHigh
          expr: |
            max(
              rgs_recovery_backlog{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"}
              and on (instance)
              (
                rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"} > 0
                and
                time() - rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"} < 60
              )
            ) >= 501
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 钱包恢复积压持续过高
            description: 新鲜数据库快照的持久调度行有界下界持续达到 501，表示实际积压至少为 501；按 Worker 取 max，禁止求和或使用陈旧样本。
        - alert: SlotsRGSRecoveryOldestDue
          expr: |
            max(
              rgs_recovery_oldest_due_age_seconds{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"}
              and on (instance)
              (
                rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"} > 0
                and
                time() - rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"} < 60
              )
            ) > 120
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 最老钱包恢复任务持续逾期
            description: 新鲜有界快照中的全局最早持久调度行已逾期超过 120 秒；应检查钱包 Lookup、数据库领取公平性、Worker 容量和熔断状态。
        - alert: SlotsRGSRecoveryLoopStale
          expr: |
            max(
              time() - rgs_recovery_loop_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"}
            ) > 30
            or
            count(
              up{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"} == 1
              unless on (instance)
              rgs_recovery_loop_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"}
            ) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: 钱包恢复循环停止前进
            description: 可抓取 Worker 的恢复循环成功时间戳缺失或超过 30 秒未更新；不得仅凭进程存活继续放量。
        - alert: SlotsRGSRecoverySnapshotStale
          expr: |
            max(
              time() - rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"}
            ) > 60
            or
            count(
              up{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"} == 1
              unless on (instance)
              rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"}
            ) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: 钱包恢复积压快照停止更新
            description: 可抓取 Worker 的数据库恢复积压快照缺失或超过 60 秒未更新；当前 backlog/age 可能陈旧，不得据此判断恢复健康。
        - alert: SlotsRGSRoundManualReview
          expr: |
            sum(increase(rgs_rounds_manual_review_total{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          labels:
            severity: critical
          annotations:
            summary: 轮次进入人工审查
            description: 新轮次已持久化转入人工审查；必须保留证据并由受控运维流程处置，禁止自动重算或补账。
        - alert: SlotsRGSIntegrityQuarantine
          expr: |
            sum(increase(rgs_round_integrity_quarantines_total{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m]))
            + sum(increase(rgs_session_integrity_quarantines_total{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          labels:
            severity: critical
          annotations:
            summary: RGS 完整性隔离事件
            description: 新的轮次或会话被持久化隔离；不得自动解封，必须保留证据并执行人工审查。
        - alert: SlotsRGSOutboxDeferred
          expr: |
            sum(increase(rgs_outbox_deferred_total{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 审计 outbox 持续延迟
            description: 审计事件发布失败并进入重试；应核对接收端、TLS、NetworkPolicy 和 backlog 新鲜度。
        - alert: SlotsRGSOutboxLeaseLost
          expr: |
            sum(increase(rgs_outbox_lease_lost_total{job="slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 审计 outbox 租约围栏冲突
            description: outbox 完成确认被租约围栏拒绝；应检查数据库延迟、工作器超时和副本争用。
        - alert: SlotsRGSDatabasePoolSaturated
          expr: |
            max(
              rgs_db_pool_in_use_connections{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}
              /
              clamp_min(rgs_db_pool_max_open_connections{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}, 1)
            ) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: RGS 数据库连接池接近耗尽
            description: 至少一个副本的运行时数据库连接池使用率持续超过百分之九十。
        - alert: SlotsRGSDatabasePoolWaits
          expr: |
            sum(rate(rgs_db_pool_wait_count_total{job=~"slots-rgs|slots-rgs-worker",namespace="{{ .Release.Namespace }}"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: RGS 数据库连接池持续等待
            description: RGS 请求持续等待数据库连接；应联动检查外部 PostgreSQL 容量和每 Pod 连接预算。
