{{- $expectedAPIURL := printf "https://%s" .Values.ingress.apiHost -}}
{{- $expectedWebOrigin := printf "https://%s" .Values.ingress.webHost -}}
{{- if ne .Values.rgs.publicBaseURL $expectedAPIURL -}}
{{- fail "rgs.publicBaseURL 必须与 ingress.apiHost 的 HTTPS origin 完全一致" -}}
{{- end -}}
{{- if not (has $expectedWebOrigin .Values.rgs.allowedOrigins) -}}
{{- fail "rgs.allowedOrigins 必须包含 ingress.webHost 的 HTTPS origin" -}}
{{- end -}}
{{- if eq .Values.ingress.apiHost .Values.ingress.webHost -}}
{{- fail "API 与 Web 必须使用不同主机名以隔离安全边界" -}}
{{- end -}}
{{- if ne (int .Values.rgs.replicaCount) (int .Values.rgs.autoscaling.minReplicas) -}}
{{- fail "rgs.replicaCount 必须等于 HPA minReplicas" -}}
{{- end -}}
{{- if ne (int .Values.web.replicaCount) (int .Values.web.autoscaling.minReplicas) -}}
{{- fail "web.replicaCount 必须等于 HPA minReplicas" -}}
{{- end -}}
{{- if ge (int .Values.rgs.pdb.minAvailable) (int .Values.rgs.autoscaling.minReplicas) -}}
{{- fail "RGS PDB minAvailable 必须小于 HPA minReplicas" -}}
{{- end -}}
{{- if ge (int .Values.web.pdb.minAvailable) (int .Values.web.autoscaling.minReplicas) -}}
{{- fail "Web PDB minAvailable 必须小于 HPA minReplicas" -}}
{{- end -}}
{{- if lt (int .Values.rgs.autoscaling.maxReplicas) (int .Values.rgs.autoscaling.minReplicas) -}}
{{- fail "RGS HPA maxReplicas 不得小于 minReplicas" -}}
{{- end -}}
{{- if lt (int .Values.web.autoscaling.maxReplicas) (int .Values.web.autoscaling.minReplicas) -}}
{{- fail "Web HPA maxReplicas 不得小于 minReplicas" -}}
{{- end -}}
{{- if gt (int .Values.rgs.runtime.databaseMaxIdleConnections) (int .Values.rgs.runtime.databaseMaxOpenConnections) -}}
{{- fail "数据库空闲连接上限不得大于总连接上限" -}}
{{- end -}}
{{- $requiredTerminationGrace := add (int .Values.rgs.shutdownTimeoutSeconds) (int .Values.rgs.preStopSeconds) 5 -}}
{{- if lt (int .Values.rgs.terminationGracePeriodSeconds) $requiredTerminationGrace -}}
{{- fail "RGS 终止宽限必须覆盖应用关闭、preStop 摘流及至少五秒调度余量" -}}
{{- end -}}
{{- $outboxWaves := div (add (int .Values.rgs.runtime.outboxBatchSize) (sub (int .Values.rgs.runtime.outboxMaxParallel) 1)) (int .Values.rgs.runtime.outboxMaxParallel) -}}
{{- $outboxPublishWindow := mul (int .Values.rgs.runtime.outboxPublishTimeoutSeconds) $outboxWaves -}}
{{- if le (int .Values.rgs.runtime.outboxLeaseSeconds) $outboxPublishWindow -}}
{{- fail "outbox 租约必须长于最坏批次发布窗口" -}}
{{- end -}}
{{- if ge (int .Values.migrator.migrationTimeoutSeconds) (int .Values.migrator.activeDeadlineSeconds) -}}
{{- fail "迁移器超时必须短于 Job activeDeadlineSeconds" -}}
{{- end -}}
{{- if and .Values.audit.mtls.enabled (or (empty .Values.audit.mtls.clientCertKey) (empty .Values.audit.mtls.clientKeyKey)) -}}
{{- fail "启用审计 mTLS 时必须同时配置客户端证书和私钥 Secret key" -}}
{{- end -}}
{{- $knownPaths := dict
  "operators.json" true
  "definition.json" true
  "definition-approval.json" true
  "definition-approval-public.pem" true
  "launch-hmac.key" true
  "outbox-hmac.key" true
  "outbox-bearer.token" true
  "outbox-root-ca.pem" true
  "trust-bundle.pem" true
-}}
{{- if .Values.audit.mtls.enabled -}}
{{- $_ := set $knownPaths "outbox-client.pem" true -}}
{{- $_ := set $knownPaths "outbox-client-key.pem" true -}}
{{- end -}}
{{- range .Values.externalSecrets.runtimeAssets.additionalItems -}}
{{- if hasKey $knownPaths .path -}}
{{- fail (printf "runtimeAssets additionalItems 路径重复: %s" .path) -}}
{{- end -}}
{{- $_ := set $knownPaths .path true -}}
{{- end -}}
{{- if .Values.audit.mtls.enabled -}}
{{- if eq .Values.audit.mtls.clientCertKey .Values.audit.mtls.clientKeyKey -}}
{{- fail "审计 mTLS 证书与私钥不得引用同一个 Secret key" -}}
{{- end -}}
{{- end -}}
{{- range $groupName, $target := .Values.networkPolicy.egress -}}
{{- range $target.cidrs -}}
{{- if eq . "0.0.0.0/0" -}}
{{- fail (printf "%s 出口禁止使用全网 CIDR" $groupName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if empty .Values.externalControls.globalRateLimitProvider -}}
{{- fail "必须声明入口网关的跨副本全局限流提供方" -}}
{{- end -}}
{{- $secretNames := list
  .Values.externalSecrets.runtimeDatabase.name
  .Values.externalSecrets.migratorDatabase.name
  .Values.externalSecrets.runtimeAssets.name
  .Values.externalSecrets.operationsBearer.name
-}}
{{- if ne (len (uniq $secretNames)) (len $secretNames) -}}
{{- fail "runtime 数据库、迁移数据库、运行密钥与 operations Bearer 必须使用四个不同 Secret" -}}
{{- end -}}
{{- if ne (index .Values.scheduling.nodeSelector "kubernetes.io/os") "linux" -}}
{{- fail "集群发布节点选择必须固定 kubernetes.io/os=linux" -}}
{{- end -}}
{{- if ne (index .Values.scheduling.nodeSelector "kubernetes.io/arch") "amd64" -}}
{{- fail "当前签名发布制品仅允许 kubernetes.io/arch=amd64" -}}
{{- end -}}
{{- if ne .Values.release.compatibilityClass "same-schema-and-definition" -}}
{{- fail "原生滚动仅接受数据库模式与数学定义均未变化的发布" -}}
{{- end -}}
