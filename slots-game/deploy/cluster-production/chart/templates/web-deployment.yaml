apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slots.resourceName" (dict "root" . "suffix" "web") }}
  labels:
    {{- include "slots.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
    slots-game.io/log-pipeline-provider: {{ .Values.externalControls.logPipelineProvider | quote }}
    slots-game.io/web-version-isolation-provider: {{ .Values.externalControls.webVersionIsolationProvider | quote }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "slots.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "slots.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
        slots-game.io/log-pipeline-provider: {{ .Values.externalControls.logPipelineProvider | quote }}
        slots-game.io/web-version-isolation-provider: {{ .Values.externalControls.webVersionIsolationProvider | quote }}
      annotations:
        slots-game.io/tls-enforcement-provider: {{ .Values.externalControls.tlsEnforcementProvider | quote }}
        slots-game.io/release-compatibility-class: {{ .Values.release.compatibilityClass | quote }}
    spec:
      serviceAccountName: {{ include "slots.resourceName" (dict "root" . "suffix" "web") }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: {{ .Values.scheduling.zoneMinDomains }}
          topologyKey: {{ .Values.scheduling.zoneTopologyKey }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "slots.selectorLabels" (dict "root" . "component" "web") | nindent 14 }}
        - maxSkew: 1
          topologyKey: {{ .Values.scheduling.hostnameTopologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "slots.selectorLabels" (dict "root" . "component" "web") | nindent 14 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.scheduling.hostnameTopologyKey }}
                labelSelector:
                  matchLabels:
                    {{- include "slots.selectorLabels" (dict "root" . "component" "web") | nindent 20 }}
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "slots.image" .Values.images.web | quote }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
