apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slots.resourceName" (dict "root" . "suffix" "rgs-worker") }}
  labels:
    {{- include "slots.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: rgs-worker
    slots-game.io/log-pipeline-provider: {{ .Values.externalControls.logPipelineProvider | quote }}
spec:
  {{- if .Values.worker.maintenanceQuiesced }}
  replicas: 0
  {{- end }}
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "slots.selectorLabels" (dict "root" . "component" "rgs-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "slots.selectorLabels" (dict "root" . "component" "rgs-worker") | nindent 8 }}
        slots-game.io/log-pipeline-provider: {{ .Values.externalControls.logPipelineProvider | quote }}
      annotations:
        slots-game.io/runtime-secret-references: {{ toJson (dict "runtimeDatabase" .Values.externalSecrets.runtimeDatabase "operationsBearer" .Values.externalSecrets.operationsBearer "workerRuntimeAssets" .Values.externalSecrets.workerRuntimeAssets) | sha256sum | quote }}
        slots-game.io/release-compatibility-class: {{ .Values.release.compatibilityClass | quote }}
        slots-game.io/definition-game-id: {{ .Values.release.definitionIdentity.gameID | quote }}
        slots-game.io/definition-version: {{ .Values.release.definitionIdentity.version | quote }}
        slots-game.io/definition-sha256: {{ .Values.release.definitionIdentity.sha256 | quote }}
    spec:
      serviceAccountName: {{ include "slots.resourceName" (dict "root" . "suffix" "rgs-worker") }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: {{ .Values.scheduling.zoneMinDomains }}
          topologyKey: {{ .Values.scheduling.zoneTopologyKey }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "slots.selectorLabels" (dict "root" . "component" "rgs-worker") | nindent 14 }}
        - maxSkew: 1
          topologyKey: {{ .Values.scheduling.hostnameTopologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "slots.selectorLabels" (dict "root" . "component" "rgs-worker") | nindent 14 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.scheduling.hostnameTopologyKey }}
                labelSelector:
                  matchLabels:
                    {{- include "slots.selectorLabels" (dict "root" . "component" "rgs-worker") | nindent 20 }}
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rgs-worker
          image: {{ include "slots.image" .Values.images.rgs | quote }}
          imagePullPolicy: {{ .Values.images.rgs.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: operations
              containerPort: 8081
              protocol: TCP
          env:
            - name: RGS_DATABASE_URL_FILE
              value: {{ printf "/run/rgs/database/%s" .Values.externalSecrets.runtimeDatabase.urlKey | quote }}
            - name: RGS_ENVIRONMENT
              value: production
            - name: RGS_RUNTIME_ROLE
              value: worker
            {{- if .Values.observability.tracing.enabled }}
            - name: RGS_OTEL_TRACES_ENDPOINT
              value: {{ .Values.observability.tracing.endpointURL | quote }}
            - name: RGS_OTEL_TRACE_SAMPLE_RATIO
              value: {{ .Values.observability.tracing.sampleRatio | quote }}
            - name: RGS_OTEL_BATCH_TIMEOUT
              value: {{ printf "%dms" (int .Values.observability.tracing.batchTimeoutMilliseconds) | quote }}
            - name: RGS_OTEL_EXPORT_TIMEOUT
              value: {{ printf "%dms" (int .Values.observability.tracing.exportTimeoutMilliseconds) | quote }}
            - name: RGS_OTEL_SHUTDOWN_TIMEOUT
              value: {{ printf "%dms" (int .Values.observability.tracing.shutdownTimeoutMilliseconds) | quote }}
            - name: RGS_OTEL_MAX_QUEUE_SIZE
              value: {{ .Values.observability.tracing.maxQueueSize | quote }}
            - name: RGS_OTEL_MAX_EXPORT_BATCH_SIZE
              value: {{ .Values.observability.tracing.maxExportBatchSize | quote }}
            {{- end }}
            - name: RGS_HTTP_ADDR
              value: 127.0.0.1:8080
            - name: RGS_OPERATIONS_HTTP_ADDR
              value: :8081
            - name: RGS_PUBLIC_BASE_URL
              value: {{ .Values.rgs.publicBaseURL | quote }}
            - name: RGS_TLS_TERMINATED_UPSTREAM
              value: "true"
            - name: RGS_ALLOWED_ORIGINS
              value: {{ join "," .Values.rgs.allowedOrigins | quote }}
            - name: RGS_OPERATOR_CONFIG_FILE
              value: /run/rgs/assets/operators.json
            - name: RGS_DEFINITION_FILE
              value: /run/rgs/assets/definition.json
            - name: RGS_DEFINITION_APPROVAL_FILE
              value: /run/rgs/assets/definition-approval.json
            - name: RGS_DEFINITION_APPROVAL_PUBLIC_KEY_FILE
              value: /run/rgs/assets/definition-approval-public.pem
            - name: RGS_EXPECTED_DEFINITION_GAME_ID
              value: {{ .Values.release.definitionIdentity.gameID | quote }}
            - name: RGS_EXPECTED_DEFINITION_VERSION
              value: {{ .Values.release.definitionIdentity.version | quote }}
            - name: RGS_EXPECTED_DEFINITION_SHA256
              value: {{ .Values.release.definitionIdentity.sha256 | quote }}
            - name: RGS_WALLET_ROOT_CA_FILE
              value: /run/rgs/assets/trust-bundle.pem
            - name: RGS_OPERATIONS_BEARER_TOKEN_FILE
              value: /run/rgs/operations/operations.token
            - name: RGS_OUTBOX_ENDPOINT_URL
              value: {{ .Values.audit.endpointURL | quote }}
            - name: RGS_OUTBOX_HMAC_KEY_ID
              value: {{ .Values.audit.hmacKeyID | quote }}
            - name: RGS_OUTBOX_HMAC_KEY_FILE
              value: /run/rgs/assets/outbox-hmac.key
            - name: RGS_OUTBOX_BEARER_TOKEN_FILE
              value: /run/rgs/assets/outbox-bearer.token
            - name: RGS_OUTBOX_ROOT_CA_FILE
              value: /run/rgs/assets/outbox-root-ca.pem
            {{- if .Values.audit.mtls.enabled }}
            - name: RGS_OUTBOX_CLIENT_CERT_FILE
              value: /run/rgs/assets/outbox-client.pem
            - name: RGS_OUTBOX_CLIENT_KEY_FILE
              value: /run/rgs/assets/outbox-client-key.pem
            {{- end }}
            - name: RGS_OUTBOX_OWNER
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: RGS_SHUTDOWN_TIMEOUT
              value: {{ printf "%ds" (int .Values.worker.shutdownTimeoutSeconds) | quote }}
            - name: RGS_DB_MAX_OPEN_CONNS
              value: {{ .Values.worker.runtime.databaseMaxOpenConnections | quote }}
            - name: RGS_DB_MAX_IDLE_CONNS
              value: {{ .Values.worker.runtime.databaseMaxIdleConnections | quote }}
            - name: RGS_MAX_CRYPTO_IN_FLIGHT
              value: {{ .Values.worker.runtime.maxCryptoInFlight | quote }}
            - name: RGS_MAX_CONNECTIONS_PER_LISTENER
              value: {{ .Values.worker.runtime.maxConnectionsPerListener | quote }}
            - name: RGS_WALLET_TIMEOUT
              value: {{ printf "%ds" (int .Values.worker.runtime.walletTimeoutSeconds) | quote }}
            - name: RGS_WALLET_MAX_ATTEMPTS
              value: {{ .Values.worker.runtime.walletMaxAttempts | quote }}
            - name: RGS_OUTBOX_BATCH_SIZE
              value: {{ .Values.worker.runtime.outboxBatchSize | quote }}
            - name: RGS_OUTBOX_MAX_PARALLEL
              value: {{ .Values.worker.runtime.outboxMaxParallel | quote }}
            - name: RGS_OUTBOX_LEASE_DURATION
              value: {{ printf "%ds" (int .Values.worker.runtime.outboxLeaseSeconds) | quote }}
            - name: RGS_OUTBOX_PUBLISH_TIMEOUT
              value: {{ printf "%ds" (int .Values.worker.runtime.outboxPublishTimeoutSeconds) | quote }}
            - name: SSL_CERT_FILE
              value: /run/rgs/assets/trust-bundle.pem
            - name: PROBE_URL
              value: http://127.0.0.1:8081/readyz
            - name: PROBE_BEARER_FILE
              value: /run/rgs/operations/operations.token
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.worker.preStopSeconds }}
          startupProbe:
            exec:
              command:
                - /service-probe
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 36
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - /service-probe
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: operations
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: runtime-database
              mountPath: /run/rgs/database
              readOnly: true
            - name: runtime-assets
              mountPath: /run/rgs/assets
              readOnly: true
            - name: operations-bearer
              mountPath: /run/rgs/operations
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: runtime-database
          secret:
            secretName: {{ .Values.externalSecrets.runtimeDatabase.name }}
            defaultMode: 0440
        - name: runtime-assets
          secret:
            secretName: {{ .Values.externalSecrets.workerRuntimeAssets.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.externalSecrets.workerRuntimeAssets.keys.operatorConfig }}
                path: operators.json
              - key: {{ .Values.externalSecrets.workerRuntimeAssets.keys.definition }}
                path: definition.json
              - key: {{ .Values.externalSecrets.workerRuntimeAssets.keys.definitionApproval }}
                path: definition-approval.json
              - key: {{ .Values.externalSecrets.workerRuntimeAssets.keys.definitionApprovalPublicKey }}
                path: definition-approval-public.pem
              - key: {{ .Values.externalSecrets.workerRuntimeAssets.keys.outboxHMAC }}
                path: outbox-hmac.key
              - key: {{ .Values.externalSecrets.workerRuntimeAssets.keys.outboxBearerToken }}
                path: outbox-bearer.token
              - key: {{ .Values.externalSecrets.workerRuntimeAssets.keys.outboxRootCA }}
                path: outbox-root-ca.pem
              - key: {{ .Values.externalSecrets.workerRuntimeAssets.keys.trustBundle }}
                path: trust-bundle.pem
              {{- if .Values.audit.mtls.enabled }}
              - key: {{ .Values.audit.mtls.clientCertKey }}
                path: outbox-client.pem
              - key: {{ .Values.audit.mtls.clientKeyKey }}
                path: outbox-client-key.pem
              {{- end }}
              {{- range .Values.externalSecrets.workerRuntimeAssets.additionalItems }}
              - key: {{ .key }}
                path: {{ .path }}
              {{- end }}
        - name: operations-bearer
          secret:
            secretName: {{ .Values.externalSecrets.operationsBearer.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.externalSecrets.operationsBearer.key }}
                path: operations.token
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
