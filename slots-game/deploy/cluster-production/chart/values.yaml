nameOverride: ""
fullnameOverride: ""

images:
  rgs:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  migrator:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  web:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  pullSecrets: []

rgs:
  maintenanceQuiesced: false
  publicBaseURL: ""
  allowedOrigins: []
  sharedAdmission:
    endpointURL: ""
    timeout: 100ms
    ratePerSecond: 500
    rateBurst: 1000
    economic:
      # 平台 EDoS 护栏，不是第三方钱包承诺容量；上线前按合同/压测证据审定。
      operatorRatePerSecond: 20
      operatorRateBurst: 40
      backendRatePerSecond: 100
      backendRateBurst: 200
  terminationGracePeriodSeconds: 45
  preStopSeconds: 5
  shutdownTimeoutSeconds: 30
  resources:
    requests:
      cpu: 500m
      memory: 384Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "2"
      memory: 768Mi
      ephemeral-storage: 256Mi
  autoscaling:
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  pdb:
    minAvailable: 2
  runtime:
    maxRequestBytes: 8192
    databaseMaxOpenConnections: 20
    databaseMaxIdleConnections: 5
    databaseCriticalReserveConnections: 5
    maxInFlightRequests: 128
    maxCryptoInFlight: 64
    maxConnectionsPerListener: 512
    preAuthRatePerSecond: 5000
    preAuthRateBurst: 10000
    ratePerSecondPerPod: 50
    rateBurstPerPod: 100
    successAccessLogSamplePerMillion: 10000
    walletFastPathTimeoutSeconds: 1
    walletTimeoutSeconds: 4
    walletMaxAttempts: 100

worker:
  maintenanceQuiesced: false
  terminationGracePeriodSeconds: 45
  preStopSeconds: 5
  shutdownTimeoutSeconds: 30
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 256Mi
  autoscaling:
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    minAvailable: 1
  runtime:
    databaseMaxOpenConnections: 10
    databaseMaxIdleConnections: 2
    maxCryptoInFlight: 64
    maxConnectionsPerListener: 128
    walletTimeoutSeconds: 4
    walletMaxAttempts: 100
    outboxBatchSize: 100
    outboxMaxParallel: 8
    outboxLeaseSeconds: 180
    outboxPublishTimeoutSeconds: 10

migrator:
  activeDeadlineSeconds: 900
  backoffLimit: 2
  migrationTimeoutSeconds: 600
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 128Mi

web:
  enabled: true
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: 500m
      memory: 192Mi
      ephemeral-storage: 128Mi
  autoscaling:
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    minAvailable: 2

ingress:
  className: ""
  tlsSecretEnabled: true
  apiHost: ""
  # 公网业务使用 8080；负载均衡健康检查固定走私有 operations 监听器。
  apiHealthCheckPath: /healthz
  apiHealthCheckPort: 8081
  webHost: ""
  apiTLSSecretName: ""
  webTLSSecretName: ""
  tlsRedirectAnnotationKey: ""
  tlsRedirectAnnotationValue: ""
  annotations: {}
  apiAnnotations: {}
  webAnnotations: {}

externalSecrets:
  runtimeDatabase:
    name: ""
    urlKey: database-url
  migratorDatabase:
    name: ""
    urlKey: database-url
  operationsBearer:
    name: ""
    key: operations.token
  sharedAdmission:
    name: ""
    keys:
      username: username
      password: password
      hmacKey: hmac.key
      rootCA: root-ca.pem
  apiRuntimeAssets:
    name: ""
    keys:
      operatorConfig: operators.json
      definition: definition.json
      definitionApproval: definition-approval.json
      definitionApprovalPublicKey: definition-approval-public.pem
      launchHMAC: launch-hmac.key
      trustBundle: trust-bundle.pem
    additionalItems: []
  workerRuntimeAssets:
    name: ""
    keys:
      operatorConfig: operators.json
      definition: definition.json
      definitionApproval: definition-approval.json
      definitionApprovalPublicKey: definition-approval-public.pem
      outboxHMAC: outbox-hmac.key
      outboxBearerToken: outbox-bearer.token
      outboxRootCA: outbox-root-ca.pem
      trustBundle: trust-bundle.pem
    additionalItems: []

audit:
  endpointURL: ""
  hmacKeyID: ""
  mtls:
    enabled: false
    clientCertKey: ""
    clientKeyKey: ""

externalControls:
  globalRateLimitProvider: ""
  tlsEnforcementProvider: ""
  logPipelineProvider: ""
  webVersionIsolationProvider: ""

release:
  compatibilityClass: ""
  definitionIdentity:
    gameID: ""
    version: ""
    sha256: ""

monitoring:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  namespaceSelector:
    matchLabels: {}
  podSelector:
    matchLabels: {}
  ruleLabels: {}

networkPolicy:
  ingressController:
    mode: selectors
    namespaceSelector:
      matchLabels: {}
    podSelector:
      matchLabels: {}
    cidrs: []
  dns:
    namespaceSelector:
      matchLabels: {}
    podSelector:
      matchLabels: {}
  egress:
    database:
      cidrs: []
      port: 5432
    wallet:
      cidrs: []
      port: 443
    audit:
      cidrs: []
      port: 443
    sharedAdmission:
      cidrs: []
      port: 6379

scheduling:
  zoneTopologyKey: topology.kubernetes.io/zone
  hostnameTopologyKey: kubernetes.io/hostname
  zoneMinDomains: 3
  nodeSelector: {}
  tolerations: []
