rule_files:
  - /rules.yaml

evaluation_interval: 1m

tests:
  - name: HPA 指标目标完全消失时必须告警
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: SlotsRGSHPAUnableToScale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: RGS HPA 无法计算扩缩容目标
              description: API 或 Worker HPA 的 ScalingActive 未保持为真；应检查 metrics-server、聚合 API、kube-state-metrics 与资源指标，避免流量高峰停留在暖副本下限。

  - name: 只有一个 HPA ScalingActive 时必须告警
    interval: 1m
    input_series:
      - series: 'kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="slots-production",condition="ScalingActive",status="true",horizontalpodautoscaler="slots-slots-cluster-production-rgs"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: SlotsRGSHPAUnableToScale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: RGS HPA 无法计算扩缩容目标
              description: API 或 Worker HPA 的 ScalingActive 未保持为真；应检查 metrics-server、聚合 API、kube-state-metrics 与资源指标，避免流量高峰停留在暖副本下限。

  - name: HPA 只报告 ScalingActive false 时必须告警
    interval: 1m
    input_series:
      - series: 'kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="slots-production",condition="ScalingActive",status="true",horizontalpodautoscaler="slots-slots-cluster-production-rgs"}'
        values: '0x8'
      - series: 'kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="slots-production",condition="ScalingActive",status="false",horizontalpodautoscaler="slots-slots-cluster-production-rgs"}'
        values: '1x8'
      - series: 'kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="slots-production",condition="ScalingActive",status="true",horizontalpodautoscaler="slots-slots-cluster-production-rgs-worker"}'
        values: '0x8'
      - series: 'kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="slots-production",condition="ScalingActive",status="false",horizontalpodautoscaler="slots-slots-cluster-production-rgs-worker"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: SlotsRGSHPAUnableToScale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: RGS HPA 无法计算扩缩容目标
              description: API 或 Worker HPA 的 ScalingActive 未保持为真；应检查 metrics-server、聚合 API、kube-state-metrics 与资源指标，避免流量高峰停留在暖副本下限。

  - name: API 与 Worker HPA 都 ScalingActive 时不得告警
    interval: 1m
    input_series:
      - series: 'kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="slots-production",condition="ScalingActive",status="true",horizontalpodautoscaler="slots-slots-cluster-production-rgs"}'
        values: '1x8'
      - series: 'kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="slots-production",condition="ScalingActive",status="true",horizontalpodautoscaler="slots-slots-cluster-production-rgs-worker"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: SlotsRGSHPAUnableToScale
        exp_alerts: []

  - name: 无关 release 的 HPA 不得填补 Worker 缺口
    interval: 1m
    input_series:
      - series: 'kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="slots-production",condition="ScalingActive",status="true",horizontalpodautoscaler="slots-slots-cluster-production-rgs"}'
        values: '1x8'
      - series: 'kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="slots-production",condition="ScalingActive",status="true",horizontalpodautoscaler="other-release-rgs"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: SlotsRGSHPAUnableToScale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: RGS HPA 无法计算扩缩容目标
              description: API 或 Worker HPA 的 ScalingActive 未保持为真；应检查 metrics-server、聚合 API、kube-state-metrics 与资源指标，避免流量高峰停留在暖副本下限。

  - name: API HPA 重复抓取不得填补 Worker 缺口
    interval: 1m
    input_series:
      - series: 'kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="slots-production",condition="ScalingActive",status="true",horizontalpodautoscaler="slots-slots-cluster-production-rgs",instance="ksm-a"}'
        values: '1x8'
      - series: 'kube_horizontalpodautoscaler_status_condition{job="kube-state-metrics",namespace="slots-production",condition="ScalingActive",status="true",horizontalpodautoscaler="slots-slots-cluster-production-rgs",instance="ksm-b"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: SlotsRGSHPAUnableToScale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: RGS HPA 无法计算扩缩容目标
              description: API 或 Worker HPA 的 ScalingActive 未保持为真；应检查 metrics-server、聚合 API、kube-state-metrics 与资源指标，避免流量高峰停留在暖副本下限。

  - name: 新经济意图触发数据库保留容量时必须告警
    interval: 1m
    input_series:
      - series: 'rgs_new_intent_capacity_rejected_total{job="slots-rgs",namespace="slots-production"}'
        values: '0 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: SlotsRGSNewIntentCapacityRejected
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: RGS 新经济意图因数据库保留容量被拒绝
              description: 新 launch 或 spin 已为保护状态查询、待交付结果和确认路径而返回容量错误；应核对数据库池、HPA 和入口流量，且只能在 PostgreSQL 总连接预算允许时扩容。

  - name: 钱包隔离拒绝必须触发告警
    interval: 1m
    input_series:
      - series: 'rgs_wallet_isolation_rejected_total{job="slots-rgs",namespace="slots-production",method="apply",reason="backend_bulkhead"}'
        values: '0 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: SlotsRGSWalletIsolationRejected
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 钱包隔离闸门拒绝请求
              description: 钱包调用被后端容量、运营商容量或熔断器非阻塞拒绝；应检查外部钱包延迟、单租户流量和隔离预算。

  - name: 钱包熔断持续打开必须触发告警
    interval: 1m
    input_series:
      - series: 'rgs_wallet_breakers{job="slots-rgs",namespace="slots-production",method="apply",state="open"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: SlotsRGSWalletCircuitOpen
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 钱包熔断器持续打开
              description: 至少一个 Apply 或 Lookup 钱包熔断器持续打开；恢复查询容量仍保持独立，Pod 就绪状态不会掩盖该依赖故障。

  - name: 钱包待定结果持续出现必须触发告警
    interval: 1m
    input_series:
      - series: 'rgs_wallet_request_duration_seconds_count{job="slots-rgs-worker",namespace="slots-production",method="lookup",outcome="pending"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: SlotsRGSWalletPendingSustained
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 钱包待定结果持续出现
              description: 钱包持续返回待定结果；应核对恢复吞吐、Lookup 延迟和积压，禁止盲目重提经济指令。

  - name: 新增人工审查轮次必须触发告警
    interval: 1m
    input_series:
      - series: 'rgs_rounds_manual_review_total{job="slots-rgs-worker",namespace="slots-production"}'
        values: '0 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: SlotsRGSRoundManualReview
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 轮次进入人工审查
              description: 新轮次已持久化转入人工审查；必须保留证据并由受控运维流程处置，禁止自动重算或补账。

  - name: 钱包响应认证失败必须单独告警
    interval: 1m
    input_series:
      - series: 'rgs_wallet_request_duration_seconds_count{job="slots-rgs-worker",namespace="slots-production",method="lookup",outcome="response_auth_invalid"}'
        values: '0 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: SlotsRGSWalletResponseAuthenticationInvalid
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 钱包响应认证失败
              description: 钱包响应签名或绑定认证失败；必须检查运营商密钥、路由绑定和响应完整性，禁止把未认证正文解释为资金结果。

  - name: 恢复积压超过固定安全门槛必须告警
    interval: 1m
    input_series:
      - series: 'rgs_recovery_backlog{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '501x15'
      - series: 'rgs_recovery_backlog{job="slots-rgs-worker",namespace="slots-production",instance="worker-b"}'
        values: '501x15'
      - series: 'rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '1 50 110 170 230 290 350 410 470 530 590 650 710 770 830'
      - series: 'rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="slots-production",instance="worker-b"}'
        values: '1 50 110 170 230 290 350 410 470 530 590 650 710 770 830'
    alert_rule_test:
      - eval_time: 11m
        alertname: SlotsRGSRecoveryBacklogHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 钱包恢复积压持续过高
              description: 新鲜数据库快照的持久调度行有界下界持续达到 501，表示实际积压至少为 501；按 Worker 取 max，禁止求和或使用陈旧样本。

  - name: 最老恢复任务过期必须告警
    interval: 1m
    input_series:
      - series: 'rgs_recovery_oldest_due_age_seconds{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '180x10'
      - series: 'rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '1 50 110 170 230 290 350 410 470 530'
    alert_rule_test:
      - eval_time: 6m
        alertname: SlotsRGSRecoveryOldestDue
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 最老钱包恢复任务持续逾期
              description: 新鲜有界快照中的全局最早持久调度行已逾期超过 120 秒；应检查钱包 Lookup、数据库领取公平性、Worker 容量和熔断状态。

  - name: 陈旧高值不得覆盖另一 Worker 的新鲜低值
    interval: 1m
    input_series:
      - series: 'rgs_recovery_backlog{job="slots-rgs-worker",namespace="slots-production",instance="worker-stale"}'
        values: '501x20'
      - series: 'rgs_recovery_oldest_due_age_seconds{job="slots-rgs-worker",namespace="slots-production",instance="worker-stale"}'
        values: '180x20'
      - series: 'rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="slots-production",instance="worker-stale"}'
        values: '1x20'
      - series: 'rgs_recovery_backlog{job="slots-rgs-worker",namespace="slots-production",instance="worker-fresh"}'
        values: '0x20'
      - series: 'rgs_recovery_oldest_due_age_seconds{job="slots-rgs-worker",namespace="slots-production",instance="worker-fresh"}'
        values: '0x20'
      - series: 'rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="slots-production",instance="worker-fresh"}'
        values: '1 50 110 170 230 290 350 410 470 530 590 650 710 770 830 890 950 1010 1070 1130'
    alert_rule_test:
      - eval_time: 16m
        alertname: SlotsRGSRecoveryBacklogHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: SlotsRGSRecoveryOldestDue
        exp_alerts: []

  - name: Worker 可抓取但缺少恢复循环时间戳必须告警
    interval: 1m
    input_series:
      - series: 'up{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 3m
        alertname: SlotsRGSRecoveryLoopStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 钱包恢复循环停止前进
              description: 可抓取 Worker 的恢复循环成功时间戳缺失或超过 30 秒未更新；不得仅凭进程存活继续放量。

  - name: Worker 恢复循环时间戳过旧必须告警
    interval: 1m
    input_series:
      - series: 'up{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '1x8'
      - series: 'rgs_recovery_loop_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 3m
        alertname: SlotsRGSRecoveryLoopStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 钱包恢复循环停止前进
              description: 可抓取 Worker 的恢复循环成功时间戳缺失或超过 30 秒未更新；不得仅凭进程存活继续放量。

  - name: Worker 恢复循环时间戳新鲜时不得告警
    interval: 1m
    input_series:
      - series: 'up{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '1x8'
      - series: 'rgs_recovery_loop_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '0 50 110 170 230 290 350 410'
    alert_rule_test:
      - eval_time: 3m
        alertname: SlotsRGSRecoveryLoopStale
        exp_alerts: []

  - name: Worker 可抓取但缺少恢复快照时间戳必须告警
    interval: 1m
    input_series:
      - series: 'up{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 4m
        alertname: SlotsRGSRecoverySnapshotStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 钱包恢复积压快照停止更新
              description: 可抓取 Worker 的数据库恢复积压快照缺失或超过 60 秒未更新；当前 backlog/age 可能陈旧，不得据此判断恢复健康。

  - name: Worker 恢复快照时间戳过旧必须告警
    interval: 1m
    input_series:
      - series: 'up{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '1x8'
      - series: 'rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 4m
        alertname: SlotsRGSRecoverySnapshotStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 钱包恢复积压快照停止更新
              description: 可抓取 Worker 的数据库恢复积压快照缺失或超过 60 秒未更新；当前 backlog/age 可能陈旧，不得据此判断恢复健康。

  - name: Worker 恢复快照时间戳新鲜时不得告警
    interval: 1m
    input_series:
      - series: 'up{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '1x8'
      - series: 'rgs_recovery_snapshot_last_success_timestamp_seconds{job="slots-rgs-worker",namespace="slots-production",instance="worker-a"}'
        values: '0 50 110 170 230 290 350 410'
    alert_rule_test:
      - eval_time: 3m
        alertname: SlotsRGSRecoverySnapshotStale
        exp_alerts: []

  - name: 钱包调用持续占用且没有完成必须告警
    interval: 1m
    input_series:
      - series: 'rgs_wallet_inflight{job="slots-rgs-worker",namespace="slots-production",method="lookup"}'
        values: '1x15'
      - series: 'rgs_wallet_request_duration_seconds_count{job="slots-rgs-worker",namespace="slots-production",method="lookup",outcome="success"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: SlotsRGSWalletRequestsStalled
        exp_alerts:
          - exp_labels:
              method: lookup
              severity: critical
            exp_annotations:
              summary: 钱包调用持续占用但没有完成
              description: 固定方法维度存在执行中钱包调用，但五分钟没有任何完成样本；应检查不响应的外部连接、硬截止与隔离槽位。

  - name: 钱包 P99 高时延且有有效流量必须告警
    interval: 1m
    input_series:
      - series: 'rgs_wallet_request_duration_seconds_bucket{job="slots-rgs",namespace="slots-production",method="apply",outcome="success",le="0.500"}'
        values: '0x20'
      - series: 'rgs_wallet_request_duration_seconds_bucket{job="slots-rgs",namespace="slots-production",method="apply",outcome="success",le="2.500"}'
        values: '0x20'
      - series: 'rgs_wallet_request_duration_seconds_bucket{job="slots-rgs",namespace="slots-production",method="apply",outcome="success",le="5.000"}'
        values: '0+60x20'
      - series: 'rgs_wallet_request_duration_seconds_bucket{job="slots-rgs",namespace="slots-production",method="apply",outcome="success",le="+Inf"}'
        values: '0+60x20'
      - series: 'rgs_wallet_request_duration_seconds_count{job="slots-rgs",namespace="slots-production",method="apply",outcome="success"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: SlotsRGSWalletLatencyHigh
        exp_alerts:
          - exp_labels:
              method: apply
              severity: warning
            exp_annotations:
              summary: 钱包调用 P99 时延持续过高
              description: 固定方法维度的钱包调用 P99 持续超过两秒且存在有效流量；应检查外部钱包、网络、熔断和恢复 Lookup 容量。
