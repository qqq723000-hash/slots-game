images:
  rgs:
    repository: registry.example.com/slots/rgs-runtime
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  migrator:
    repository: registry.example.com/slots/rgs-migrator
    digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
  web:
    repository: registry.example.com/slots/web
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  pullSecrets:
    - name: company-registry

rgs:
  maintenanceQuiesced: false
  publicBaseURL: https://rgs.example.com
  allowedOrigins:
    - https://slots.example.com
  sharedAdmission:
    endpointURL: rediss://valkey.example.internal:6379
    # 仅为平台保护上限；必须替换为经钱包合同和目标环境压测批准的值。
    # English: Only a platform protection upper limit; must be replaced with a value approved by the wallet
    # contract and target environment stress testing.
    economic:
      operatorRatePerSecond: 20
      operatorRateBurst: 40
      backendRatePerSecond: 100
      backendRateBurst: 200

worker:
  maintenanceQuiesced: false

web:
  enabled: true

ingress:
  className: nginx
  tlsSecretEnabled: true
  apiHost: rgs.example.com
  apiHealthCheckPath: /healthz
  apiHealthCheckPort: 8081
  webHost: slots.example.com
  apiTLSSecretName: rgs-ingress-tls
  webTLSSecretName: web-ingress-tls
  tlsRedirectAnnotationKey: nginx.ingress.kubernetes.io/force-ssl-redirect
  tlsRedirectAnnotationValue: "true"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 128k
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"

externalSecrets:
  runtimeDatabase:
    name: slots-rgs-runtime-database-v1
  migratorDatabase:
    name: slots-rgs-migrator-database-v1
  operationsBearer:
    name: slots-rgs-operations-bearer-v1
  sharedAdmission:
    name: slots-rgs-shared-admission-v1
  apiRuntimeAssets:
    name: slots-rgs-api-runtime-assets-v1
    additionalItems:
      - key: operator-access-private.pem
        path: keys/operator-access-private.pem
      - key: operator-access-public.pem
        path: keys/operator-access-public.pem
      - key: operator-request-public.pem
        path: keys/operator-request-public.pem
      - key: operator-response-private.pem
        path: keys/operator-response-private.pem
      - key: operator-response-public.pem
        path: keys/operator-response-public.pem
      - key: wallet-request-private.pem
        path: keys/wallet-request-private.pem
      - key: wallet-request-public.pem
        path: keys/wallet-request-public.pem
      - key: wallet-response-public.pem
        path: keys/wallet-response-public.pem
  workerRuntimeAssets:
    name: slots-rgs-worker-runtime-assets-v1
    additionalItems:
      - key: wallet-request-private.pem
        path: keys/wallet-request-private.pem
      - key: wallet-request-public.pem
        path: keys/wallet-request-public.pem
      - key: wallet-response-public.pem
        path: keys/wallet-response-public.pem

audit:
  endpointURL: https://audit.example.com/rgs/events
  hmacKeyID: rgs-audit-2026-01

externalControls:
  globalRateLimitProvider: company-api-gateway
  tlsEnforcementProvider: ingress-nginx-policy
  logPipelineProvider: company-node-log-pipeline
  webVersionIsolationProvider: company-web-blue-green

release:
  compatibilityClass: same-schema-and-definition
  definitionIdentity:
    gameID: iron-colossus
    version: definition-v1
    sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

monitoring:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ruleLabels:
    prometheus: company-platform

# 示例显式启用受控 OTLP/HTTP collector；生产默认值仍为 disabled + 空 endpoint。
# English: The example explicitly enables the controlled OTLP/HTTP collector; the artifactsion default is still
# disabled + empty endpoint.
observability:
  tracing:
    enabled: true
    endpointURL: https://otel-collector.example.internal:4318/v1/traces
    sampleRatio: 0.01
    batchTimeoutMilliseconds: 1000
    exportTimeoutMilliseconds: 3000
    shutdownTimeoutMilliseconds: 5000
    maxQueueSize: 1024
    maxExportBatchSize: 256

networkPolicy:
  ingressController:
    mode: selectors
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      matchLabels:
        app.kubernetes.io/name: ingress-nginx
    cidrs: []
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  egress:
    database:
      cidrs:
        - 10.20.0.0/24
    wallet:
      cidrs:
        - 10.30.0.0/24
    audit:
      cidrs:
        - 10.40.0.0/24
    sharedAdmission:
      cidrs:
        - 10.50.0.0/24
    tracing:
      cidrs:
        - 10.60.0.0/24
      port: 4318

scheduling:
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
