worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout combined;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 1m;

  server {
    listen 8443 ssl;
    server_name alert-proxy alertmanager;
    ssl_certificate /run/alert-secrets/alertmanager-server.pem;
    ssl_certificate_key /run/alert-secrets/alertmanager-server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location = /healthz {
      access_log off;
      return 204;
    }

    location = /_authorize {
      internal;
      proxy_pass https://wallet:8443/internal/auth/alertmanager;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      proxy_ssl_server_name on;
      proxy_ssl_name wallet;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /run/alert-secrets/local-production-root-ca.pem;
    }

    location / {
      auth_request /_authorize;
      proxy_pass http://alertmanager:9093;
      proxy_http_version 1.1;
      proxy_set_header Host alertmanager:9093;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }
  }
}
