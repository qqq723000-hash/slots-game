worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout combined;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 64k;
  keepalive_timeout 30s;
  send_timeout 20s;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:4m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  # 两个公开入口统一声明一年 HSTS；本机域名不加入 preload 或跨主机范围。
  add_header Strict-Transport-Security "max-age=31536000" always;

  # 未匹配本机集成验收主机名的 SNI/Host 不能落到 Web 或 API。
  server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
  }

  server {
    listen 8443 ssl;
    server_name slots.localhost;
    ssl_certificate /run/ingress-secrets/ingress-server.pem;
    ssl_certificate_key /run/ingress-secrets/ingress-server-key.pem;

    location = /operator {
      return 308 https://slots.localhost:8443/operator/;
    }

    # 配套服务内部只有根路由；这里显式去掉 /operator/ 前缀。
    location /operator/ {
      proxy_pass https://wallet:8443/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_ssl_server_name on;
      proxy_ssl_name wallet;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /run/ingress-secrets/local-production-root-ca.pem;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }

    # launcher 表单与 API 使用根绝对路径，必须精确回流到运营服务。
    location = /launch {
      proxy_pass https://wallet:8443/launch;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_ssl_server_name on;
      proxy_ssl_name wallet;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /run/ingress-secrets/local-production-root-ca.pem;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }

    location = /api/v1/launches {
      proxy_pass https://wallet:8443/api/v1/launches;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_ssl_server_name on;
      proxy_ssl_name wallet;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /run/ingress-secrets/local-production-root-ca.pem;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }

    location / {
      proxy_pass http://web:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }
  }

  server {
    listen 8443 ssl;
    server_name rgs.localhost;
    ssl_certificate /run/ingress-secrets/ingress-server.pem;
    ssl_certificate_key /run/ingress-secrets/ingress-server-key.pem;

    # RGS 存活探针只存在于私有 operations:8081；公网入口不得代理该路径。
    location = /healthz {
      return 404;
    }

    location / {
      proxy_pass http://rgs:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_connect_timeout 3s;
      proxy_read_timeout 20s;
      proxy_request_buffering on;
      proxy_buffering off;
    }
  }
}
