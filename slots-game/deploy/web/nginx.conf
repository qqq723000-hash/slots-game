# HTML、发布身份和探针不得被中间层存储。只有 Vite 在顶层生成、文件名含内容 hash 的
# JS/CSS 可设为 immutable；public/ 的稳定名称资产仍必须在版本之间重新验证。
map "$status:$uri" $web_cache_control {
  default "no-store, max-age=0";
  ~^(?:200|206|304):/assets/[^/]+-[A-Za-z0-9_-][A-Za-z0-9_-][A-Za-z0-9_-][A-Za-z0-9_-][A-Za-z0-9_-][A-Za-z0-9_-][A-Za-z0-9_-][A-Za-z0-9_-]*\.(?:css|js)$ "public, max-age=31536000, immutable";
  ~^(?:200|304):/assets/(?:.+/)?(?:runtime-manifest|streaming-packages)\.json$ "no-store, max-age=0";
  ~^(?:200|206|304):/assets/ "no-cache";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  etag on;
  max_ranges 1;
  disable_symlinks if_not_owner from=$document_root;

  add_header Cache-Control $web_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # CI 静态契约默认禁止跨源连接和嵌入；production runtime 必须由受控构建脚本渲染精确
  # RGS/运营商 origin，任何脚本源或 frame/connect 通配符都不允许。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-vUs+nbdxmdqOL3f/mZqTupLfHkYf373z+iYtj/+kHtM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; trusted-types slots-game-static-html; require-trusted-types-for 'script'; frame-ancestors 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /livez {
    access_log off;
    default_type text/plain;
    return 200 "live\n";
  }

  # readiness 同时确认入口与可复算发布清单仍在只读文档根中；条件只检查固定文件并返回，
  # 不执行 URI 重写，也不依赖外部服务。
  location = /readyz {
    access_log off;
    default_type text/plain;
    if (!-f $document_root/index.html) { return 503 "not ready\n"; }
    if (!-f $document_root/release-manifest.json) { return 503 "not ready\n"; }
    return 200 "ready\n";
  }

  location = /index.html {
    try_files $uri =404;
  }

  location = /release-manifest.json {
    try_files $uri =404;
  }

  location ~* ^/assets/(.+/)?(runtime-manifest|streaming-packages)\.json$ {
    try_files $uri =404;
  }

  # Range 由 nginx 静态模块提供并受上方上限约束。缓存策略只通过 map 在 server 级选择，
  # 避免 location 级 add_header 取消每个响应应继承的安全 header。
  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
